apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - webapp.yaml
  - http-route-public.yaml
  - http-route-portal.yaml
  - network-policy.yaml
  - disruption-budget.yaml
  - secret-store.yaml
  - external-secret-disclosure.yaml
  - external-secret-numina.yaml
  - external-secret-stripe.yaml
  - job-portal-migration.yaml
# The publisher pins only the WebApp's image; the migration Job runs that same image.
replacements:
  - source:
      kind: WebApp
      name: business-site
      fieldPath: spec.image
    targets:
      - select:
          kind: Job
          name: business-site-portal-migration
        fieldPaths:
          - spec.template.spec.containers.[name=migrate].image
        options:
          create: true
