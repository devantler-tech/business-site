apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: business-site
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: business-site
          serviceAccountRef:
            name: business-site
