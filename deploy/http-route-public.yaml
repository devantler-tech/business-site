# devantler.tech and its www name, on their own gateway listeners. The runtime
# redirects www to the apex and portal paths to portal.devantler.tech.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: business-site-public
  namespace: business-site
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https-devantler-tech
    - name: platform
      namespace: kube-system
      sectionName: https-www-devantler-tech
  hostnames:
    - devantler.tech
    - www.devantler.tech
  rules:
    - backendRefs:
        - name: business-site
          port: 80
