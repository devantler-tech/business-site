apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: business-site-disclosure
  namespace: business-site
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: business-site-disclosure
    creationPolicy: Owner
  data:
    - secretKey: company-disclosure
      remoteRef:
        key: apps/business-site/public-disclosure
        property: company-disclosure
