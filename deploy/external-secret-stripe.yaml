apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: business-site-stripe
  namespace: business-site
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: business-site-stripe
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: apps/business-site/stripe
        property: api-key
    - secretKey: webhook-secret
      remoteRef:
        key: apps/business-site/stripe
        property: webhook-secret
