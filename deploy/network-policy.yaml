apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: business-site
  namespace: business-site
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: business-site
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress: []
