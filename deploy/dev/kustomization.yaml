apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Dev (devantler-tech/business-site#542): the shared base, changed only by the
# patches below. The platform reconciles it at `path: ./dev` in its own
# namespace and owns its ingress behind sign-on (devantler-tech/platform#6126),
# so dev adds no route, certificate, DNS, disruption budget or prod secret store.
namespace: business-site-dev
resources:
  - ../base
patches:
  # A tenant WebApp's name and spec.name must equal its namespace; spec.name also
  # names and labels the generated Deployment, Service and route.
  - target:
      kind: WebApp
      name: business-site
    patch: |-
      - op: replace
        path: /metadata/name
        value: business-site-dev
      - op: replace
        path: /spec/name
        value: business-site-dev
      - op: replace
        path: /spec/host
        value: dev.devantler.tech
      - op: replace
        path: /spec/replicas
        value: 1
      # Drop prod's host routing; with neither host argument one host serves
      # the public pages and the portal paths. The tests fail the build if
      # base moves these arguments.
      - op: test
        path: /spec/args/6
        value: --public-host
      - op: test
        path: /spec/args/7
        value: devantler.tech
      - op: test
        path: /spec/args/8
        value: --portal-host
      - op: test
        path: /spec/args/9
        value: portal.devantler.tech
      - op: remove
        path: /spec/args/9
      - op: remove
        path: /spec/args/8
      - op: remove
        path: /spec/args/7
      - op: remove
        path: /spec/args/6
  # Select the renamed workload's pods.
  - target:
      kind: CiliumNetworkPolicy
      name: business-site
    patch: |-
      - op: replace
        path: /spec/endpointSelector/matchLabels/app.kubernetes.io~1name
        value: business-site-dev
