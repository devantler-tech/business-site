apiVersion: batch/v1
kind: Job
metadata:
  name: business-site-dev-migration
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app.kubernetes.io/name: business-site-dev-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          args:
            - --migrate
            - --migration-database-projection
            - /run/portal-migration/database-url
            - --runtime-role
            - portal_preview_web
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: migration
              mountPath: /run/portal-migration
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: migration
          secret:
            secretName: business-site-dev-migration
            defaultMode: 0400
            items:
              - key: database-url
                path: database-url
              - key: ca.crt
                path: ca.crt
        # The migration command requires a sticky directory for its CA file.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
