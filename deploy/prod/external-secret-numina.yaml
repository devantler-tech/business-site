apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: business-site-numina
  namespace: business-site
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: business-site-numina
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: apps/business-site/numina
        property: api-key
