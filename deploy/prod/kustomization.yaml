apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - ../practice-job
  - http-route-public.yaml
  - http-route-portal.yaml
  - network-policy.yaml
  - disruption-budget.yaml
  - secret-store.yaml
  - external-secret-disclosure.yaml
  - external-secret-numina.yaml
  - external-secret-stripe.yaml
  - job-portal-migration.yaml
  - cronjob-portal-retention.yaml
patches:
  - target:
      group: batch
      version: v1
      kind: Job
      name: business-site-dev-migration
    patch: |-
      - op: replace
        path: /metadata/name
        value: business-site-practice-migration
      - op: add
        path: /metadata/namespace
        value: business-site
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1name
        value: business-site-practice-migration
      - op: test
        path: /spec/template/spec/volumes/0/name
        value: migration
      - op: replace
        path: /spec/template/spec/volumes/0/secret/secretName
        value: business-site-practice-migration
  - target:
      group: kro.run
      version: v1alpha1
      kind: WebApp
      name: business-site
    patch: |-
      - op: add
        path: /spec/args/-
        value: --portal-upstream-logout-url
      - op: add
        path: /spec/args/-
        value: https://accounts.devantler.tech/oidc/v1/end_session
      - op: add
        path: /spec/args/-
        value: --portal-upstream-logout-client-id
      - op: add
        path: /spec/args/-
        value: "399712320588158469"
# Both migrations and the retention CronJob run the image the publisher pins
# for the WebApp.
replacements:
  - source:
      kind: WebApp
      name: business-site
      fieldPath: spec.image
    targets:
      - select:
          kind: Job
          name: business-site-portal-migration
        fieldPaths:
          - spec.template.spec.containers.[name=migrate].image
        options:
          create: true
      - select:
          kind: Job
          name: business-site-practice-migration
        fieldPaths:
          - spec.template.spec.containers.[name=migrate].image
        options:
          create: true
      - select:
          kind: CronJob
          name: business-site-portal-retention
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=purge].image
        options:
          create: true
