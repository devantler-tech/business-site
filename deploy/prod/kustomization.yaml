apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Production: the shared base plus everything only prod owns — the public and
# portal routes, the disruption budget and the disclosure read from prod OpenBao.
resources:
  - ../base
  - http-route-public.yaml
  - http-route-portal.yaml
  - disruption-budget.yaml
  - secret-store.yaml
  - external-secret-disclosure.yaml
