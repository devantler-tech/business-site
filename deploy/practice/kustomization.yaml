apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../dev

patches:
  - target:
      kind: WebApp
      name: business-site-dev
    patch: |-
      apiVersion: kro.run/v1alpha1
      kind: WebApp
      metadata:
        name: business-site-dev
        annotations:
          config.kubernetes.io/local-config: "true"
