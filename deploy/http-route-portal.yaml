# portal.devantler.tech on its own gateway listener. The runtime opens the portal
# at / and redirects public pages to devantler.tech.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: business-site-portal
  namespace: business-site
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https-portal-devantler-tech
  hostnames:
    - portal.devantler.tech
  rules:
    - backendRefs:
        - name: business-site
          port: 80
