# Keep every scanner enabled. Package context precedes the actual selected files.
# The bundled 2.13.2 decoder cannot read Go 1.27 export data. The supported
# executable override preserves MegaLinter's rules, project scope and fix mode.
GO_GOLANGCI_LINT_CLI_EXECUTABLE: ["go", "run", "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0"]
GO_REVIVE_ARGUMENTS: ["./..."]
GO_REVIVE_CLI_LINT_MODE: list_of_files
# The bundled OSV binary's Go 1.26 analyzer cannot load the Go 1.27 module.
# Rebuild the same scanner with this module's selected compiler; keep all targets.
REPOSITORY_OSV_SCANNER_CLI_EXECUTABLE: ["bash", "/github/workspace/scripts/scan-go-source.sh"]
HTML_HTMLHINT_CONFIG_FILE: .htmlhintrc
# The required workflow scans the server module from a nested workspace.
HTML_HTMLHINT_RULES_PATH: /github/workspace
SPELL_CSPELL_CONFIG_FILE: .cspell.json
SPELL_CSPELL_RULES_PATH: /github/workspace
REPOSITORY_SECRETLINT_RULES_PATH: /github/workspace
# Private forms have mixed methods and authentication. The adapter retains every
# target in explicit method-aware coverage; ordinary documents stay byte-identical.
# Pace repeated requests to the same host. All failed responses still fail the scan.
SPELL_LYCHEE_ARGUMENTS:
  - "--preprocess"
  - "/github/workspace/scripts/portal-links-preprocess.sh"
  - "--host-concurrency"
  - "2"
  - "--host-request-interval"
  - "500ms"
  # Check the same public file and ref through the content endpoint when the
  # rendered blob page is unreliable. Leave fragments and moving branches alone.
  - "--remap"
  - >-
    ^https://github\.com/devantler-tech/business-site/blob/([a-f0-9]{40})/(server/[A-Za-z0-9._/-]+\.md)$
    https://raw.githubusercontent.com/devantler-tech/business-site/$1/$2
  - "--remap"
  - >-
    ^https://github\.com/bufbuild/buf/blob/v1\.72\.0/private/bufpkg/bufmodule/digest\.go$
    https://raw.githubusercontent.com/bufbuild/buf/v1.72.0/private/bufpkg/bufmodule/digest.go
