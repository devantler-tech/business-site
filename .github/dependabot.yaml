version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    ignore:
      # Node types follow .node-version; a runtime-major move is reviewed together.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # svelte-kit sync and svelte-check load the JavaScript compiler API, which TypeScript 7.0 does
      # not ship, so `typescript` stays on 6.x and type checking runs on TypeScript 7 through the
      # `@typescript/native` alias (svelte-check --tsgo). Remove once both accept TypeScript 7 (#137).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    schedule:
      interval: daily
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: daily
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude:
        - devantler-tech/*
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      # astro-mermaid supports Mermaid 10/11, not an unverified major upgrade.
      - dependency-name: mermaid
        update-types: [version-update:semver-major]
