version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    ignore:
      # Node types follow .node-version; a runtime-major move is reviewed together.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # svelte-kit sync and svelte-check load the JavaScript compiler API, which TypeScript 7.0 does
      # not ship, so `typescript` stays on 6.x and type checking runs on TypeScript 7 through the
      # `@typescript/native` alias (svelte-check --tsgo). Remove once both accept TypeScript 7 (#137).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    schedule:
      interval: daily
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: daily
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude:
        - devantler-tech/*
    # The runtime publisher stays on a revision the platform has approved for this
    # tenant (its publish-workflow-canonical-approvals list): the platform refuses a
    # release signed by any other. Every devantler-tech/.github release moved it, so
    # releases after v3.0.0 were signed by unapproved revisions and the platform could
    # not pin them (devantler-tech/platform#5267). The platform's image admission
    # check trusts fewer revisions than that list, so the pin must be in both: v3.0.0
    # and v3.2.1 were signed by v19.0.12, and the platform refused to start them.
    # Move this pin by hand, in its own change, once the platform approves a newer
    # revision in both places.
    ignore:
      - dependency-name: "devantler-tech/.github/.github/workflows/publish-app.yaml"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      # astro-mermaid supports Mermaid 10/11, not an unverified major upgrade.
      - dependency-name: mermaid
        update-types: [version-update:semver-major]
