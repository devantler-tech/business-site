name: Publish - Public Runtime

on:
  release:
    types: [published]

permissions: {}

jobs:
  admit:
    if: ${{ github.repository == 'devantler-tech/business-site' && github.event_name == 'release' && vars.RUNTIME_PUBLICATION_ENABLED == 'true' && !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      image-digest: ${{ steps.admit.outputs.image-digest }}
      public-digest: ${{ steps.admit.outputs.public-digest }}
      ci-run-id: ${{ steps.admit.outputs.ci-run-id }}
      ci-run-attempt: ${{ steps.admit.outputs.ci-run-attempt }}
      version: ${{ steps.admit.outputs.version }}
    steps:
      - name: Checkout the immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup the exact receipt-reader toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Compile the source-owned archive reader
        env:
          GOTOOLCHAIN: local
        run: go -C server build -o "$RUNNER_TEMP/runtime-receipt" ./cmd/runtime-receipt
      - name: Admit the exact release source and original current CI archive
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_PUBLICATION_ENABLED: ${{ vars.RUNTIME_PUBLICATION_ENABLED }}
          RELEASE_MODE: release
        run: bash scripts/admit-runtime-release.sh
      - name: Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Authenticate only for registry reads
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Reserve the immutable helper directory
        run: test ! -e .runtime-publisher && test ! -L .runtime-publisher
      - name: Checkout only the accepted immutable original-image verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devantler-tech/.github
          ref: 467f07582436a26b62cf4aa756423512f85ba0c0
          path: .runtime-publisher
          persist-credentials: false
      - name: Verify the original image signature and complete provenance
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.admit.outputs.image-digest }}
          PUBLIC_DIGEST: ${{ steps.admit.outputs.public-digest }}
          ORIGINAL_CI_RUN_ID: ${{ steps.admit.outputs.ci-run-id }}
          ORIGINAL_CI_RUN_ATTEMPT: ${{ steps.admit.outputs.ci-run-attempt }}
        run: bash scripts/verify-runtime-origin.sh

  publish:
    needs: admit
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: devantler-tech/.github/.github/workflows/publish-app.yaml@f5d078cc4b04ecb15432ed4e34cba1142a6279d4
    with:
      app-name: business-site
      deploy-path: ./deploy
      enable-caller-pin: true
      enable-signed-promotion: true
      enable-prebuilt-webapp: true
      enable-signed-recovery: false
      prebuilt-image-digest: ${{ needs.admit.outputs.image-digest }}
      prebuilt-public-digest: ${{ needs.admit.outputs.public-digest }}
      prebuilt-ci-run-id: ${{ needs.admit.outputs.ci-run-id }}
      prebuilt-ci-run-attempt: ${{ needs.admit.outputs.ci-run-attempt }}

  verify:
    needs: [admit, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Checkout the immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Setup Flux artifact reader
        uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
      - name: Authenticate only for registry reads
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Independently verify both signed immutable subjects and version aliases
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.admit.outputs.version }}
          IMAGE_DIGEST: ${{ needs.admit.outputs.image-digest }}
          PUBLIC_DIGEST: ${{ needs.admit.outputs.public-digest }}
          ORIGINAL_CI_RUN_ID: ${{ needs.admit.outputs.ci-run-id }}
          ORIGINAL_CI_RUN_ATTEMPT: ${{ needs.admit.outputs.ci-run-attempt }}
        run: bash scripts/verify-runtime-publication.sh
      - name: Preserve the independently verified public pair receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: business-site-runtime-publication
          path: ${{ runner.temp }}/runtime-publication.json
          if-no-files-found: error
          retention-days: 30
