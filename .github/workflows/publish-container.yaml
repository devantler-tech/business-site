name: Publish Container

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

# Image distribution only. Pages remains authoritative; no cluster deployment.
concurrency:
  group: publish-container
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    env:
      LC_ALL: C
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout the successful immutable main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Download only this successful CI run's tested image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: business-site-container
          path: runtime-dist/container
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Load and re-exercise the exact tested image before registry writes
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          tar -xzf runtime-dist/container/business-site-runtime.tar.gz -C runtime-dist
          docker load --input runtime-dist/container/image.tar.gz
          node scripts/container-smoke.test.mjs business-site:test runtime-dist
      - name: Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push only the tested image to a run-scoped staging tag
        id: image
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          image=ghcr.io/devantler-tech/business-site
          tag="$image:staging-$RUN_ID-$RUN_ATTEMPT"
          docker tag business-site:test "$tag"
          docker push "$tag"
          ref="$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')"
          [[ "$ref" =~ ^ghcr.io/devantler-tech/business-site@sha256:[0-9a-f]{64}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Sign and verify source-bound digest and build provenance
        env:
          PUBLISHED_IMAGE: ${{ steps.image.outputs.ref }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ && "$CI_RUN_ATTEMPT" =~ ^[0-9]+$ && "$RUN_ID" =~ ^[0-9]+$ && "$RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$WORKFLOW_IDENTITY" == https://github.com/devantler-tech/business-site/.github/workflows/publish-container.yaml@refs/heads/main ]]
          mkdir -p runtime-dist/container-publication
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges "$PUBLISHED_IMAGE" --version > runtime-dist/container-publication/runtime.json
          public_digest="$(jq -er --arg sha "$SOURCE_SHA" 'select(.Repository == "devantler-tech/business-site" and .SourceRevision == $sha and .Mode == "release") | .PublicDigest' runtime-dist/container-publication/runtime.json)"
          [[ "$public_digest" =~ ^[0-9a-f]{64}$ ]]
          digest="${PUBLISHED_IMAGE##*@}"
          annotations=(
            -a devantler.repository=devantler-tech/business-site
            -a "devantler.source-sha=$SOURCE_SHA"
            -a "devantler.public-digest=$public_digest"
            -a "devantler.ci-run-id=$CI_RUN_ID"
            -a "devantler.ci-run-attempt=$CI_RUN_ATTEMPT"
            -a "devantler.run-id=$RUN_ID"
            -a "devantler.run-attempt=$RUN_ATTEMPT"
            -a "devantler.workflow-sha=$WORKFLOW_SHA"
          )
          cosign sign --yes "${annotations[@]}" "$PUBLISHED_IMAGE"
          cosign verify --certificate-identity "$WORKFLOW_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "${annotations[@]}" "$PUBLISHED_IMAGE" > runtime-dist/container-publication/signature.json
          jq -n --arg identity "$WORKFLOW_IDENTITY" --arg sha "$SOURCE_SHA" --arg ci "$CI_RUN_ID" --arg attempt "$CI_RUN_ATTEMPT" --arg run "$RUN_ID" --arg digest "$public_digest" '{builder:{id:$identity},buildType:"https://devantler.tech/build-types/combined-runtime-container/v1",invocation:{configSource:{uri:"git+https://github.com/devantler-tech/business-site",digest:{sha1:$sha},entryPoint:".github/workflows/ci.yaml"},parameters:{ciRunId:$ci,ciRunAttempt:$attempt,publicDigest:$digest}},metadata:{buildInvocationId:("https://github.com/devantler-tech/business-site/actions/runs/"+$run),completeness:{parameters:true,environment:false,materials:false},reproducible:false},materials:[{uri:"git+https://github.com/devantler-tech/business-site",digest:{sha1:$sha}}]}' > runtime-dist/container-publication/provenance.json
          cosign attest --yes --type slsaprovenance --predicate runtime-dist/container-publication/provenance.json "$PUBLISHED_IMAGE"
          cosign verify-attestation --type slsaprovenance --certificate-identity "$WORKFLOW_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$PUBLISHED_IMAGE" > runtime-dist/container-publication/attestation.json
          # Check the signed statement's actual subject and source, not only that
          # some statement exists under this publisher's identity.
          jq -es --arg sha "$SOURCE_SHA" --arg digest "${digest#sha256:}" '[.[] | .payload | @base64d | fromjson | select(.predicateType == "https://slsa.dev/provenance/v0.2" and .predicate.invocation.configSource.digest.sha1 == $sha and any(.subject[]; .digest.sha256 == $digest))] | length > 0' runtime-dist/container-publication/attestation.json
          jq -n --arg ref "$PUBLISHED_IMAGE" --arg source "$SOURCE_SHA" --arg public "$public_digest" --arg identity "$WORKFLOW_IDENTITY" --arg workflow "$WORKFLOW_SHA" --arg ci "$CI_RUN_ID" --arg attempt "$CI_RUN_ATTEMPT" --arg run "$RUN_ID" --arg runAttempt "$RUN_ATTEMPT" '{repository:"devantler-tech/business-site",sourceRevision:$source,publicDigest:$public,image:$ref,signerIdentity:$identity,workflowRevision:$workflow,ciRunId:$ci,ciRunAttempt:$attempt,publicationRunId:$run,publicationRunAttempt:$runAttempt}' > runtime-dist/container-publication/receipt.json
      - name: Pull and exercise the signed published digest, not its tag
        env:
          PUBLISHED_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker pull "$PUBLISHED_IMAGE"
          node scripts/container-smoke.test.mjs "$PUBLISHED_IMAGE" runtime-dist
      - name: Upload source/digest/signature/provenance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: business-site-container-publication
          path: runtime-dist/container-publication
          if-no-files-found: error
          retention-days: 90
