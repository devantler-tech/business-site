name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      docs-deps: ${{ steps.filter.outputs.docs-deps }}
      docs-audit-contract: ${{ steps.filter.outputs.docs-audit-contract }}
      docs-npm-toolchain: ${{ steps.filter.outputs.docs-npm-toolchain }}
      active-projects: ${{ steps.filter.outputs.active-projects }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docs:
              - '.node-version'
              - 'research/**'
              - 'web/**'
              - 'src/**'
              - 'public/**'
              - 'scripts/**'
              - '*.json'
              - '.npmrc'
              - 'docs/**'
              - 'deploy/**'
              - '.github/workflows/**'
            docs-deps:
              - 'package.json'
              - 'package-lock.json'
              - 'npm-shrinkwrap.json'
              - '.npmrc'
              - 'scripts/audit-dependencies.sh'
            docs-audit-contract:
              - '.npmrc'
              - 'scripts/audit-dependencies.sh'
              - 'scripts/audit-dependencies.test.sh'
              - '.github/workflows/audit-docs.yaml'
              - '.github/workflows/ci.yaml'
            docs-npm-toolchain:
              - '.node-version'
              - 'web/package.json'
              - 'web/package-lock.json'
              - '.github/dependabot.yaml'
              - 'package.json'
              - 'scripts/npm-toolchain.test.sh'
              - 'scripts/dependency-overrides.test.sh'
              - '.github/workflows/**'
            active-projects:
              - 'src/content/**'
              - 'src/data/public-products.json'
              - 'src/data/cv.ts'
              - 'scripts/check-active-projects-drift.sh'
              - 'scripts/check-active-projects-drift.test.sh'
              - 'scripts/check-homepage-project-parity.mjs'
              - 'scripts/check-cv-drift.mjs'
              - 'scripts/check-cv-drift.test.sh'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yaml'

  build-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LC_ALL: C
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify lockfile with older supported npm
        working-directory: .
        run: npx --yes --package=npm@11.4.2 npm ci --ignore-scripts
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Verify candidate frontend lockfile with older supported npm
        working-directory: web
        run: npx --yes --package=npm@11.4.2 npm ci --ignore-scripts
      - name: Install candidate frontend dependencies
        working-directory: web
        run: npm ci
      - name: Verify the Svelte frontend and independent business settings
        run: bash scripts/check-svelte-frontend.sh
      - name: Verify the retained frontend decision samples
        run: bash scripts/check-frontend-research.sh
      - name: Verify native content and publication refusals
        run: |
          node --test scripts/public-build.test.mjs scripts/public-build-contract.test.mjs scripts/package-profile-contract.test.mjs
          node --test scripts/theme.test.mjs scripts/visitor-privacy.test.mjs scripts/journal-navigation.test.mjs
          node --test scripts/customer-scope-rollout.test.mjs scripts/vat-prices-retirement.test.mjs scripts/proposal-offerings.test.mjs
          node --test scripts/vat-activation.test.mjs scripts/fresh-publication.test.mjs
          node --test scripts/public-tools.test.mjs scripts/public-products.test.mjs
          bash scripts/journal-history.test.sh
      - name: Build
        working-directory: .
        env:
          FEATURE_PREVIEW_BANNER: "false"
          FEATURE_COMPANY_IDENTITY: "false"
          FEATURE_OFFER_COPY: "false"
        run: npm run build
      - name: Build entirely unset production
        working-directory: .
        run: env -u FEATURE_CLIENT_PORTFOLIO -u FEATURE_PREVIEW_BANNER -u FEATURE_OFFER_COPY -u FEATURE_FEATURED_PORTFOLIO -u FEATURE_COMPANY_IDENTITY npm run build
      - name: Verify the published Journal presentation
        working-directory: .
        run: node scripts/check-journal-presentation.mjs dist
      - name: Verify offering-copy accessibility controls
        run: node scripts/check-offering-copy.test.mjs dist
      - name: Verify public portal boundary controls
        run: bash scripts/check-portal-artifacts.test.sh
      - name: Build current production presentation
        id: current-production
        working-directory: .
        env:
          FEATURE_COMPANY_IDENTITY: "true"
          FEATURE_OFFER_COPY: "false"
          COMPANY_POSTAL_ADDRESS: "Example Road 1\n1234 Exampletown"
        run: npm run build
      - name: Verify the actual public artifact excludes portal identity
        run: bash scripts/check-portal-artifacts.sh dist
      - name: Upload reviewable production preview
        # Only static public output is eligible; server code and identity fixtures
        # must not enter the preview artifact.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: business-site-preview
          path: dist
          if-no-files-found: error
          retention-days: 7

  audit-docs:
    needs: changes
    if: needs.changes.outputs.docs-deps == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Test audit wrapper
        working-directory: .
        run: ./scripts/audit-dependencies.test.sh
      - name: Audit
        working-directory: .
        run: ./scripts/audit-dependencies.sh

  test-docs-audit-wrapper:
    needs: changes
    if: needs.changes.outputs.docs-audit-contract == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Test audit wrapper
        working-directory: .
        run: ./scripts/audit-dependencies.test.sh

  test-docs-npm-toolchain:
    needs: changes
    if: needs.changes.outputs.docs-npm-toolchain == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test npm toolchain contract
        run: bash scripts/npm-toolchain.test.sh
      - name: Test dependency override contract
        run: bash scripts/dependency-overrides.test.sh

  drift-check-active-projects:
    needs: changes
    if: needs.changes.outputs.active-projects == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install MDX parser dependencies
        working-directory: .
        run: npm ci
      # The monorepo validates the real pinned sibling products. This source
      # repository retains all hermetic negative controls, not a fake live census.
      - name: Self-test the drift checker
        run: bash scripts/check-active-projects-drift.test.sh
      - name: Self-test the CV drift checker
        run: bash scripts/check-cv-drift.test.sh
      - name: Check the About page and CV data for drift
        run: node scripts/check-cv-drift.mjs src/content/docs/about.mdx src/data/cv.ts

  test-repository-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup the exact receipt-reader toolchain
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Verify source-owned publishing and editorial contracts
        run: |
          bash scripts/publishing-contract.test.sh
          bash scripts/editorial-contract.test.sh
      - name: Verify Go source scanner compiler selection
        run: bash scripts/scan-go-source.test.sh
      - name: Verify source, current original CI and unextracted archive admission
        env:
          GOTOOLCHAIN: local
        run: bash scripts/runtime-release.test.sh
      - name: Verify original signatures and independent paired publication readback
        run: bash scripts/runtime-verification.test.sh
      - name: Verify default-off release authority and immutable caller wiring
        run: bash scripts/runtime-publisher-contract.test.sh

  # Tool installation and quality observers have no database dependency.
  test-portal-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      LC_ALL: C
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Setup Node.js for portal quality
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        working-directory: .
        run: npm ci
      - name: Verify locked checker provisioning and stalled-registry failure controls
        working-directory: .
        run: node --test scripts/portal-quality-provisioning.test.mjs
      - name: Verify actual Go-template HTML quality and retained attribute failures
        working-directory: .
        run: npx --yes --package="htmlhint@$(node -p 'require("./package.json").devDependencies.htmlhint')" -- node --test scripts/portal-template-quality.test.mjs
      - name: Verify compatible embedded Go analysis and genuine finding rejection
        working-directory: .
        run: node --test scripts/portal-go-analyzer-quality.test.mjs
      - name: Verify rendered portal targets and ordinary document passthrough
        working-directory: .
        run: bash scripts/portal-links-preprocess.test.sh
      - name: Install the pinned Lychee checker
        working-directory: .
        run: |
          archive="$(mktemp)"
          trap 'rm -f -- "$archive"' EXIT
          curl --disable --proto '=https' --fail --silent --show-error --location --retry 2 --max-time 60 \
            --output "$archive" https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' '1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a' "$archive" | sha256sum --check --status
          install_dir="$RUNNER_TEMP/portal-link-checker"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          test -x "$install_dir/lychee"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Verify public GitHub records with read-only credentials
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/check-portal-links.sh --github-records
      - name: Verify exact fictional credential examples and adjacent leak rejection
        working-directory: .
        run: npx --yes --package="secretlint@$(node -p 'require("./package.json").devDependencies.secretlint')" -- node --test scripts/portal-credential-quality.test.mjs
      - name: Verify portal copy and API vocabulary with retained typo failures
        working-directory: .
        run: npx --yes --package="cspell@$(node -p 'require("./package.json").devDependencies.cspell')" -- node --test scripts/portal-spelling-quality.test.mjs
      - name: Verify package documentation with all selected Go files
        working-directory: .
        env:
          GOBIN: ${{ runner.temp }}/portal-quality-tools
        run: |
          go install github.com/mgechev/revive@v1.16.0
          PORTAL_REVIVE="$GOBIN/revive" bash scripts/portal-package-quality.test.sh
      - name: Verify complete ordinary-suite composition
        working-directory: .
        run: node --test scripts/identity-cohorts.test.mjs

  test-portal-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    env:
      LC_ALL: C
      GOTOOLCHAIN: local
      PORTAL_TEST_DATABASE_URL: postgres://portal_runtime:fixture-only@localhost:5432/portal_identity_test?sslmode=disable
      PORTAL_TEST_MIGRATION_DATABASE_URL: postgres://portal_migrator:fixture-only@localhost:5432/portal_identity_test?sslmode=disable
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: portal_fixture_owner
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_fixture_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Setup Node.js for cohort verification
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Test actual served request-character controls
        working-directory: .
        run: node --test scripts/portal-request-limits.test.mjs
      - name: Test the served workspace creation dialog
        working-directory: .
        run: node --test scripts/operator-directory.test.mjs
      - name: Provision isolated test database roles
        env:
          PGPASSWORD: fixture-only
        run: psql -h localhost -U portal_fixture_owner -d postgres -v ON_ERROR_STOP=1 -f testdata/provision.sql
      - name: Verify real Go trial host with its own unchanged test budget
        working-directory: server
        run: go test -race -tags=contacttrialintegration ./internal/identity -run '^TestContactTrialHost' -count=1 -timeout=90s
      - name: Verify retained Go contact HTTP and post-wait authority
        working-directory: .
        run: bash scripts/check-go-contact.sh
      - name: Verify dependencies and formatting
        run: |
          go mod verify
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: List the complete compiled ordinary test inventory
        run: go test -race -p=1 ./... -list '^(Test|Example|Fuzz)' -count=1 -timeout=90s -json > test-inventory.jsonl
      - name: Test broker and durable access boundary
        shell: bash
        run: go test -race -coverprofile=coverage-core.out -p=1 ./... -count=1 -timeout=90s -json -skip '^Test(Work(Approval|Review|Eligibility|Funding|Lease|QueueRevision)|Private|Operator|Proposal|Sharing|Consent|Acceptance|Invoice|Credit)' | tee test-core.jsonl
      - name: Verify every core test ran exactly once
        run: node ../scripts/identity-cohorts.mjs core
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # The work and private/operator cohorts need their own database and job budget.
  test-portal-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    env:
      LC_ALL: C
      GOTOOLCHAIN: local
      PORTAL_TEST_DATABASE_URL: postgres://portal_runtime:fixture-only@localhost:5432/portal_identity_test?sslmode=disable
      PORTAL_TEST_MIGRATION_DATABASE_URL: postgres://portal_migrator:fixture-only@localhost:5432/portal_identity_test?sslmode=disable
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: portal_fixture_owner
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_fixture_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Setup Node.js for cohort verification
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Provision isolated test database roles
        env:
          PGPASSWORD: fixture-only
        run: psql -h localhost -U portal_fixture_owner -d postgres -v ON_ERROR_STOP=1 -f testdata/provision.sql
      - name: List the complete compiled ordinary test inventory
        run: go test -race -p=1 ./... -list '^(Test|Example|Fuzz)' -count=1 -timeout=90s -json > test-inventory.jsonl
      - name: Test work approval and review boundary
        shell: bash
        run: go test -race -coverprofile=coverage-work.out -p=1 ./... -count=1 -timeout=90s -json -run '^TestWork(Approval|Review|Eligibility|Funding|Lease|QueueRevision)' | tee test-work.jsonl
      - name: Test private and operator flows
        shell: bash
        run: go test -race -coverprofile=coverage-private.out -p=1 ./... -count=1 -timeout=90s -json -run '^Test(Private|Operator|Proposal|Sharing|Consent|Acceptance|Invoice|Credit)' | tee test-private.jsonl
      - name: Verify every work and private test ran exactly once
        run: node ../scripts/identity-cohorts.mjs work private

  test-tenant-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LC_ALL: C
      GOTOOLCHAIN: local
    steps:
      - name: Checkout Business Site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout the Platform admission checker and policies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devantler-tech/platform
          ref: 25dc8d22079e07b337d108df20b1d1c7f90aad00 # Platform #6712
          path: .tenant-policy-source
          persist-credentials: false
      - name: Setup Go for the Platform WebApp compiler
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .tenant-policy-source/scripts/tests/webapp-compiler/go.mod
          cache-dependency-path: .tenant-policy-source/scripts/tests/webapp-compiler/go.sum
      - name: Compile the generated production WebApp children
        id: generated-workloads
        shell: bash
        env:
          KRO_API_BASE: HEAD
        run: |
          work="$(mktemp -d "$RUNNER_TEMP/tenant-admission.XXXXXXXX")"
          kubectl kustomize deploy > "$work/production.yaml"
          yq -o=json -I=0 '.' "$work/production.yaml" | jq -cse '
            [.[] | select(.kind == "WebApp")]
            | if length == 1 then .[0] else error("expected exactly one production WebApp") end
          ' > "$work/application.json"
          bash .tenant-policy-source/scripts/tests/test-webapp-compiler.sh \
            --render-admission-children "$work/application.json" "$work/children.json"
          printf 'directory=%s\n' "$work" >> "$GITHUB_OUTPUT"
      - name: Setup Go for the Platform admission checker
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .tenant-policy-source/scripts/tests/tenant-webapp-admission/go.mod
          cache-dependency-path: .tenant-policy-source/scripts/tests/tenant-webapp-admission/go.sum
      - name: Setup Node.js for fixture generation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install fixture dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Exercise production package admission with Kyverno
        id: tenant-admission
        shell: bash
        env:
          ADMISSION_DIRECTORY: ${{ steps.generated-workloads.outputs.directory }}
        run: |
          infrastructure="$GITHUB_WORKSPACE/.tenant-policy-source/k8s/bases/infrastructure"
          policies="$infrastructure/cluster-policies/best-practices"
          tenant_graph="$infrastructure/resource-graph-definitions/tenant/resource-graph-definition.yaml"
          node scripts/tenant-admission-fixtures.mjs "$tenant_graph" "$ADMISSION_DIRECTORY/children.json" < "$ADMISSION_DIRECTORY/production.yaml" |
            go -C .tenant-policy-source/scripts/tests/tenant-webapp-admission run -mod=readonly . \
              "$policies/restrict-tenant-webapps.yaml" "$policies/validate-pod-security.yaml" \
              "$policies/restrict-tenant-route-hostnames.yaml" "$policies/restrict-webapp-child-ownership.yaml" \
              "$policies/restrict-tenant-secret-stores.yaml" "$policies/restrict-tenant-network-policies.yaml"

  # Separate setup/build budget; identity and quality must finish successfully first.
  test-combined-runtime:
    needs: [test-portal-quality, test-portal-identity, test-portal-flows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      LC_ALL: C
      GOTOOLCHAIN: local
    steps:
      - name: Checkout complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Setup Node.js for combined package
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install frontend dependencies
        working-directory: .
        run: npm ci
      - name: Install candidate frontend dependencies
        working-directory: .
        run: npm --prefix web ci
      - name: Verify combined-runtime CI contract
        working-directory: .
        run: |
          node --test scripts/runtime-stages.test.mjs
          node --test scripts/runtime-contract.test.mjs
          node --test scripts/go-contact.test.mjs
          node --test scripts/container-contract.test.mjs
      - name: Prepare the runner-provided Kubernetes renderer
        id: tenant-renderer
        timeout-minutes: 1
        working-directory: .
        run: |
          command -v kubectl
          kubectl version --client --output=json
      - name: Verify the dormant public tenant package and refusal controls
        working-directory: .
        run: node --test scripts/tenant-package.test.mjs
      - name: Verify compiled dependency inventory and failed-read refusals
        working-directory: .
        run: bash scripts/runtime-dependencies.test.sh
      - name: Build actual combined package
        working-directory: .
        run: bash scripts/package-runtime.sh --release
      - name: Exercise actual combined package
        working-directory: .
        run: node scripts/runtime-smoke.test.mjs runtime-dist
      - name: Exercise extracted runtime archive
        working-directory: .
        run: |
          extracted="$(mktemp -d)"
          tar -xzf runtime-dist/business-site-runtime.tar.gz -C "$extracted"
          node scripts/runtime-smoke.test.mjs "$extracted"
      - name: Build actual restricted container
        working-directory: .
        run: |
          package="$(find runtime-dist -maxdepth 1 -type d -name 'package.*')"
          test -n "$package" && test "$(printf '%s\n' "$package" | wc -l)" -eq 1
          docker build --file Dockerfile --label "org.opencontainers.image.source=https://github.com/devantler-tech/business-site" --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" --tag business-site:test "$package"
      - name: Exercise actual restricted container
        working-directory: .
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/container-smoke.test.mjs business-site:test runtime-dist
      - name: Archive the tested container and its exact runtime package
        working-directory: .
        run: |
          mkdir -p runtime-dist/container
          docker save business-site:test | gzip > runtime-dist/container/image.tar.gz
          cp runtime-dist/business-site-runtime.tar.gz runtime-dist/container/
      - name: Build the production public-content template
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/package-runtime.sh --release --production-template
      - name: Exercise production template with private fictional disclosure
        working-directory: .
        run: node scripts/runtime-smoke.test.mjs runtime-production-dist
      - name: Exercise extracted production archive
        working-directory: .
        run: |
          extracted="$(mktemp -d)"
          tar -xzf runtime-production-dist/business-site-runtime.tar.gz -C "$extracted"
          node scripts/runtime-smoke.test.mjs "$extracted"
      - name: Build actual production-profile container
        working-directory: .
        run: |
          package="$(find runtime-production-dist -maxdepth 1 -type d -name 'package.*')"
          test -n "$package" && test "$(printf '%s\n' "$package" | wc -l)" -eq 1
          docker build --file Dockerfile --label "org.opencontainers.image.source=https://github.com/devantler-tech/business-site" --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" --tag business-site:production-test "$package"
      - name: Exercise actual production-profile container
        working-directory: .
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/container-smoke.test.mjs business-site:production-test runtime-production-dist
      - name: Exercise the rendered tenant arguments in the actual restricted image
        working-directory: .
        timeout-minutes: 3
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/tenant-runtime-smoke.test.mjs business-site:production-test
      - name: Archive the tested production container and package
        working-directory: .
        run: |
          docker save business-site:production-test | gzip > runtime-dist/container/production-image.tar.gz
          cp runtime-production-dist/business-site-runtime.tar.gz runtime-dist/container/business-site-production-runtime.tar.gz
      - name: Upload tested container
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: business-site-container
          path: runtime-dist/container
          if-no-files-found: error
          retention-days: 7
      - name: Upload reviewed runtime package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: business-site-runtime
          path: runtime-dist/business-site-runtime.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Publication waits for complete validation; final required checks also
  # cover signing, provenance verification and the published-image smoke test.
  validation:
    name: CI - Prepublication Checks
    runs-on: ubuntu-latest
    if: always()
    permissions: {}
    needs:
      - changes
      - build-docs
      - audit-docs
      - test-docs-audit-wrapper
      - test-docs-npm-toolchain
      - drift-check-active-projects
      - test-repository-contracts
      - test-portal-identity
      - test-portal-flows
      - test-portal-quality
      - test-tenant-admission
      - test-combined-runtime
    steps:
      - name: Check job results
        uses: devantler-tech/.github/actions/aggregate-job-checks@d45338f0ba120e87bdb05c1f70691afe2ec9d2ca # v22.7.5
        with:
          job-results: >-
            ${{ needs.changes.result }}
            ${{ needs.build-docs.result }}
            ${{ needs.audit-docs.result }}
            ${{ needs.test-docs-audit-wrapper.result }}
            ${{ needs.test-docs-npm-toolchain.result }}
            ${{ needs.drift-check-active-projects.result }}
            ${{ needs.test-repository-contracts.result }}
            ${{ needs.test-portal-identity.result }}
            ${{ needs.test-portal-flows.result }}
            ${{ needs.test-portal-quality.result }}
            ${{ needs.test-tenant-admission.result }}
            ${{ needs.test-combined-runtime.result }}

  status:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: read
    needs:
      - changes
      - build-docs
      - audit-docs
      - test-docs-audit-wrapper
      - test-docs-npm-toolchain
      - drift-check-active-projects
      - test-repository-contracts
      - test-portal-identity
      - test-portal-flows
      - test-portal-quality
      - test-tenant-admission
      - test-combined-runtime
      - validation
      - publish-container
    steps:
      - name: Check job results
        uses: devantler-tech/.github/actions/aggregate-job-checks@d45338f0ba120e87bdb05c1f70691afe2ec9d2ca # v22.7.5
        with:
          check-workflow-startup: "true"
          job-results: >-
            ${{ needs.changes.result }}
            ${{ needs.build-docs.result }}
            ${{ needs.audit-docs.result }}
            ${{ needs.test-docs-audit-wrapper.result }}
            ${{ needs.test-docs-npm-toolchain.result }}
            ${{ needs.drift-check-active-projects.result }}
            ${{ needs.test-repository-contracts.result }}
            ${{ needs.test-portal-identity.result }}
            ${{ needs.test-portal-flows.result }}
            ${{ needs.test-portal-quality.result }}
            ${{ needs.test-tenant-admission.result }}
            ${{ needs.test-combined-runtime.result }}
            ${{ needs.validation.result }}
            ${{ needs.publish-container.result }}
      - name: Require actual main-push container publication
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'devantler-tech/business-site'
        env:
          PUBLICATION_RESULT: ${{ needs.publish-container.result }}
        run: test "$PUBLICATION_RESULT" = success

  # The same run distributes its tested bytes only after the complete CI gate.
  # No privileged workflow_run crosses from an untrusted PR to registry writes.
  publish-container:
    needs: [validation, test-combined-runtime]
    if: >-
      !cancelled() &&
      needs.validation.result == 'success' &&
      needs.test-combined-runtime.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'devantler-tech/business-site'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    env:
      LC_ALL: C
      SOURCE_SHA: ${{ github.sha }}
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout the successful immutable main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Download only this successful CI run's tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: business-site-container
          path: runtime-dist/container
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Go for the image projection checks
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Load and re-exercise the exact tested image before registry writes
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          tar -xzf runtime-dist/container/business-site-runtime.tar.gz -C runtime-dist
          docker load --input runtime-dist/container/image.tar.gz
          node scripts/container-smoke.test.mjs business-site:test runtime-dist
          mkdir -p runtime-production-dist
          tar -xzf runtime-dist/container/business-site-production-runtime.tar.gz -C runtime-production-dist
          docker load --input runtime-dist/container/production-image.tar.gz
          node scripts/container-smoke.test.mjs business-site:production-test runtime-production-dist
      - name: Setup Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push only the tested image to a run-scoped staging tag
        id: image
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          image=ghcr.io/devantler-tech/business-site
          tag="$image:staging-$RUN_ID-$RUN_ATTEMPT"
          docker tag business-site:production-test "$tag"
          docker push "$tag"
          ref="$(docker image inspect "$tag" --format '{{json .RepoDigests}}' |
            jq -er --arg image "$image" 'map(select(startswith($image + "@"))) | unique | select(length == 1) | .[0]')"
          [[ "$ref" =~ ^ghcr.io/devantler-tech/business-site@sha256:[0-9a-f]{64}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Sign and verify source-bound digest and build provenance
        env:
          PUBLISHED_IMAGE: ${{ steps.image.outputs.ref }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ && "$CI_RUN_ATTEMPT" =~ ^[0-9]+$ && "$RUN_ID" =~ ^[0-9]+$ && "$RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$WORKFLOW_IDENTITY" == https://github.com/devantler-tech/business-site/.github/workflows/ci.yaml@refs/heads/main ]]
          mkdir -p runtime-dist/container-publication
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges "$PUBLISHED_IMAGE" --version > runtime-dist/container-publication/runtime.json
          public_digest="$(jq -er --arg sha "$SOURCE_SHA" 'select(.Repository == "devantler-tech/business-site" and .SourceRevision == $sha and .Mode == "release" and .PublicProfile == "production-template") | .PublicDigest' runtime-dist/container-publication/runtime.json)"
          [[ "$public_digest" =~ ^[0-9a-f]{64}$ ]]
          digest="${PUBLISHED_IMAGE##*@}"
          annotations=(
            -a devantler.repository=devantler-tech/business-site
            -a "devantler.source-sha=$SOURCE_SHA"
            -a "devantler.public-digest=$public_digest"
            -a devantler.public-profile=production-template
            -a "devantler.ci-run-id=$CI_RUN_ID"
            -a "devantler.ci-run-attempt=$CI_RUN_ATTEMPT"
            -a "devantler.run-id=$RUN_ID"
            -a "devantler.run-attempt=$RUN_ATTEMPT"
            -a "devantler.workflow-sha=$WORKFLOW_SHA"
          )
          cosign sign --yes "${annotations[@]}" "$PUBLISHED_IMAGE"
          cosign verify --certificate-identity "$WORKFLOW_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "${annotations[@]}" "$PUBLISHED_IMAGE" > runtime-dist/container-publication/signature.json
          jq -n --arg identity "$WORKFLOW_IDENTITY" --arg sha "$SOURCE_SHA" --arg ci "$CI_RUN_ID" --arg attempt "$CI_RUN_ATTEMPT" --arg run "$RUN_ID" --arg digest "$public_digest" '{builder:{id:$identity},buildType:"https://devantler.tech/build-types/combined-runtime-container/v1",invocation:{configSource:{uri:"git+https://github.com/devantler-tech/business-site",digest:{sha1:$sha},entryPoint:".github/workflows/ci.yaml"},parameters:{ciRunId:$ci,ciRunAttempt:$attempt,publicDigest:$digest,publicProfile:"production-template"}},metadata:{buildInvocationId:("https://github.com/devantler-tech/business-site/actions/runs/"+$run),completeness:{parameters:true,environment:false,materials:false},reproducible:false},materials:[{uri:"git+https://github.com/devantler-tech/business-site",digest:{sha1:$sha}}]}' > runtime-dist/container-publication/provenance.json
          cosign attest --yes --type slsaprovenance --predicate runtime-dist/container-publication/provenance.json "$PUBLISHED_IMAGE"
          cosign verify-attestation --type slsaprovenance --certificate-identity "$WORKFLOW_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$PUBLISHED_IMAGE" > runtime-dist/container-publication/attestation.json
          # Check the signed statement's actual subject and source, not only that
          # some statement exists under this publisher's identity.
          jq -es --arg sha "$SOURCE_SHA" --arg digest "${digest#sha256:}" '[.[] | .payload | @base64d | fromjson | select(.predicateType == "https://slsa.dev/provenance/v0.2" and .predicate.invocation.configSource.digest.sha1 == $sha and any(.subject[]; .digest.sha256 == $digest))] | length > 0' runtime-dist/container-publication/attestation.json
          jq -n --arg ref "$PUBLISHED_IMAGE" --arg source "$SOURCE_SHA" --arg public "$public_digest" --arg identity "$WORKFLOW_IDENTITY" --arg workflow "$WORKFLOW_SHA" --arg ci "$CI_RUN_ID" --arg attempt "$CI_RUN_ATTEMPT" --arg run "$RUN_ID" --arg runAttempt "$RUN_ATTEMPT" '{repository:"devantler-tech/business-site",sourceRevision:$source,publicDigest:$public,publicProfile:"production-template",image:$ref,signerIdentity:$identity,workflowRevision:$workflow,ciRunId:$ci,ciRunAttempt:$attempt,publicationRunId:$run,publicationRunAttempt:$runAttempt}' > runtime-dist/container-publication/receipt.json
      - name: Pull and exercise the signed published digest, not its tag
        env:
          PUBLISHED_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker pull "$PUBLISHED_IMAGE"
          node scripts/container-smoke.test.mjs "$PUBLISHED_IMAGE" runtime-production-dist
      - name: Upload source/digest/signature/provenance receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: business-site-container-publication
          path: runtime-dist/container-publication
          if-no-files-found: error
          retention-days: 90
