name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      docs-deps: ${{ steps.filter.outputs.docs-deps }}
      docs-audit-contract: ${{ steps.filter.outputs.docs-audit-contract }}
      docs-npm-toolchain: ${{ steps.filter.outputs.docs-npm-toolchain }}
      active-projects: ${{ steps.filter.outputs.active-projects }}
      zitadel-build: ${{ steps.filter.outputs.zitadel-build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            zitadel-build:
              - 'Dockerfile.zitadel'
              - 'scripts/*zitadel*'
              - 'scripts/testdata/zitadel-login-icons/**'
              - 'scripts/testdata/go1.26.10/**'
              - 'scripts/testdata/zitadel-source/**'
              - 'scripts/testdata/zitadel-metadata-profile/**'
              - 'third_party/zitadel-login-icons/**'
              - 'third_party/zitadel-console-notices/**'
              - 'third_party/zitadel-go-module-notices/**'
              - 'server/cmd/zitadel-module-sources/**'
              - 'server/cmd/zitadel-bsr-sources/**'
              - 'tools/zitadel-pnpm-source/**'
              - 'server/go.mod'
              - 'server/go.sum'
              - 'docs/ZITADEL-SOURCE.md'
              - '.github/workflows/ci.yaml'
            docs:
              - '.node-version'
              - 'research/**'
              - 'web/**'
              - 'src/**'
              - 'public/**'
              - 'scripts/**'
              - '*.json'
              - '.npmrc'
              - 'astro.config.mjs'
              - 'docs/**'
              - 'deploy/**'
              - '.github/workflows/**'
            docs-deps:
              - 'package.json'
              - 'package-lock.json'
              - 'npm-shrinkwrap.json'
              - '.npmrc'
              - 'scripts/audit-dependencies.sh'
            docs-audit-contract:
              - '.npmrc'
              - 'scripts/audit-dependencies.sh'
              - 'scripts/audit-dependencies.test.sh'
              - '.github/workflows/audit-docs.yaml'
              - '.github/workflows/ci.yaml'
            docs-npm-toolchain:
              - '.node-version'
              - 'web/package.json'
              - 'web/package-lock.json'
              - '.github/dependabot.yaml'
              - 'package.json'
              - 'scripts/npm-toolchain.test.sh'
              - 'scripts/dependency-overrides.test.sh'
              - '.github/workflows/**'
            active-projects:
              - 'src/content/**'
              - 'src/data/public-products.json'
              - 'src/data/cv.ts'
              - 'scripts/check-active-projects-drift.sh'
              - 'scripts/check-active-projects-drift.test.sh'
              - 'scripts/check-homepage-project-parity.mjs'
              - 'scripts/check-cv-drift.mjs'
              - 'scripts/check-cv-drift.test.sh'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yaml'

  build-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LC_ALL: C
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify lockfile with older supported npm
        working-directory: .
        run: npx --yes --package=npm@11.4.2 npm ci --ignore-scripts
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Verify candidate frontend lockfile with older supported npm
        working-directory: web
        run: npx --yes --package=npm@11.4.2 npm ci --ignore-scripts
      - name: Install candidate frontend dependencies
        working-directory: web
        run: npm ci
      - name: Verify the isolated Svelte frontend in both release states
        run: bash scripts/check-svelte-frontend.sh
      - name: Verify the retained frontend decision samples
        run: bash scripts/check-frontend-research.sh
      - name: Build enabled preview
        working-directory: .
        env:
          FEATURE_PREVIEW_BANNER: "true"
        run: npm run build
      - name: Build client-facing portfolio preview
        working-directory: .
        env:
          FEATURE_CLIENT_PORTFOLIO: "true"
        run: npm run build
      - name: Build customer-scope preview
        working-directory: .
        env:
          FEATURE_CUSTOMER_SCOPE: "true"
        run: npm run build
      - name: Build revised hosting-offer preview
        working-directory: .
        env:
          FEATURE_OFFER_COPY: "true"
        run: npm run build
      - name: Build legacy revised hosting-offer preview
        working-directory: .
        env:
          FEATURE_CLIENT_PORTFOLIO: "false"
          FEATURE_FEATURED_PORTFOLIO: "false"
          FEATURE_OFFER_COPY: "true"
        run: npm run build
      - name: Build featured portfolio preview
        working-directory: .
        env:
          FEATURE_FEATURED_PORTFOLIO: "true"
        run: npm run build
      - name: Build
        working-directory: .
        env:
          FEATURE_PREVIEW_BANNER: "false"
          FEATURE_CLIENT_PORTFOLIO: "false"
          FEATURE_COMPANY_IDENTITY: "false"
          FEATURE_CUSTOMER_SCOPE: "false"
          FEATURE_OFFER_COPY: "false"
          FEATURE_FEATURED_PORTFOLIO: "false"
        run: npm run build
      - name: Build entirely unset production
        working-directory: .
        run: env -u FEATURE_CLIENT_PORTFOLIO -u FEATURE_PREVIEW_BANNER -u FEATURE_OFFER_COPY -u FEATURE_FEATURED_PORTFOLIO -u FEATURE_COMPANY_IDENTITY -u FEATURE_CUSTOMER_SCOPE npm run build
      - name: Verify the published Journal presentation
        working-directory: .
        run: node scripts/check-journal-presentation.mjs dist
      - name: Verify offering-copy accessibility controls
        run: node scripts/check-offering-copy.test.mjs dist
      - name: Verify public portal boundary controls
        run: bash scripts/check-portal-artifacts.test.sh
      - name: Build current production presentation
        id: current-production
        working-directory: .
        env:
          FEATURE_COMPANY_IDENTITY: "true"
          FEATURE_SVELTE_FRONTEND: "true"
          FEATURE_OFFER_COPY: "false"
          FEATURE_CUSTOMER_SCOPE: "false"
          COMPANY_POSTAL_ADDRESS: "Example Road 1\n1234 Exampletown"
        run: npm run build
      - name: Verify the actual public artifact excludes portal identity
        run: bash scripts/check-portal-artifacts.sh dist
      - name: Upload reviewable production preview
        # Only static public output is eligible; server code and identity fixtures
        # must not enter the preview or Pages artifact.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: business-site-preview
          path: dist
          if-no-files-found: error
          retention-days: 7

  audit-docs:
    needs: changes
    if: needs.changes.outputs.docs-deps == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Test audit wrapper
        working-directory: .
        run: ./scripts/audit-dependencies.test.sh
      - name: Audit
        working-directory: .
        run: ./scripts/audit-dependencies.sh

  test-docs-audit-wrapper:
    needs: changes
    if: needs.changes.outputs.docs-audit-contract == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Test audit wrapper
        working-directory: .
        run: ./scripts/audit-dependencies.test.sh

  test-docs-npm-toolchain:
    needs: changes
    if: needs.changes.outputs.docs-npm-toolchain == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test npm toolchain contract
        run: bash scripts/npm-toolchain.test.sh
      - name: Test dependency override contract
        run: bash scripts/dependency-overrides.test.sh

  drift-check-active-projects:
    needs: changes
    if: needs.changes.outputs.active-projects == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install MDX parser dependencies
        working-directory: .
        run: npm ci
      # The monorepo validates the real pinned sibling products. This source
      # repository retains all hermetic negative controls, not a fake live census.
      - name: Self-test the drift checker
        run: bash scripts/check-active-projects-drift.test.sh
      - name: Self-test the CV drift checker
        run: bash scripts/check-cv-drift.test.sh
      - name: Check the About page and CV data for drift
        run: node scripts/check-cv-drift.mjs src/content/docs/about.mdx src/data/cv.ts

  test-zitadel-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup the prepared-source test compiler
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: Exercise frozen upstream source preparation and refusal controls
        run: bash scripts/prepare-zitadel-source.test.sh
      - name: Exercise Linux build orchestration refusal controls
        run: |
          bash scripts/build-zitadel-linux.test.sh
          bash scripts/zitadel-build-contract.test.sh

  build-zitadel-linux:
    needs: changes
    if: needs.changes.outputs.zitadel-build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      LC_ALL: C
      GOTOOLCHAIN: local
      COREPACK_ENABLE_PROJECT_SPEC: "0"
      COREPACK_DEFAULT_TO_LATEST: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Admit the disposable build capacity
        run: |
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 12582912
          test "$(awk '/MemTotal:/ {print $2}' /proc/meminfo)" -ge 12582912
      - name: Setup the source verifier compiler
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Verify selected Go source retention
        working-directory: server
        run: |
          go test -race ./cmd/zitadel-module-sources
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/zitadel-module-sources" ./cmd/zitadel-module-sources
      - name: Verify selected schema source retention
        working-directory: server
        run: |
          go test -race ./cmd/zitadel-bsr-sources
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/zitadel-bsr-sources" ./cmd/zitadel-bsr-sources
      - name: Setup the frozen identity Go compiler
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: Verify the bounded login icon inventory
        working-directory: scripts
        run: go test -race zitadel-login-icons.go zitadel-login-icons_test.go
      - name: Verify the bounded console notice capture
        working-directory: scripts
        run: go test -race zitadel-console-notices.go zitadel-console-notices_test.go zitadel-console-supplement_test.go zitadel-toolchain-notices_test.go zitadel-source-notices_test.go
      - name: Verify local identity image packaging and execution controls
        working-directory: scripts
        run: go test -race zitadel-image-package.go zitadel-image-smoke.go zitadel-image-package_test.go zitadel-image-smoke_test.go
      - name: Verify sealed source snapshots and closed archive controls
        working-directory: scripts
        run: go test -race zitadel-source-bundle.go zitadel-source-bundle_test.go
      - name: Verify original console generator archives
        working-directory: scripts
        run: go test -race zitadel-console-assets.go zitadel-console-assets_test.go
      # This isolated upstream profile does not install or build the website's
      # npm application. Its older Node input is exact and checksum-bound.
      - name: Prepare the frozen identity JavaScript toolchain
        run: |
          tools="$RUNNER_TEMP/zitadel-tools"
          mkdir "$tools"
          curl --fail --location --silent --show-error --max-time 120 https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz -o "$tools/node.tar.xz"
          (cd "$tools" && printf '%s\n' 'df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de  node.tar.xz' | shasum -a 256 -c -)
          tar -xJf "$tools/node.tar.xz" -C "$tools"
          export PATH="$tools/node-v22.23.3-linux-x64/bin:$PATH"
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          echo "$tools/node-v22.23.3-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Verify native pnpm source retention
        run: |
          npm ci --prefix tools/zitadel-pnpm-source --ignore-scripts
          node --test tools/zitadel-pnpm-source/index.test.mjs
      - name: Fetch the frozen public upstream input
        run: |
          git init "$RUNNER_TEMP/zitadel-upstream"
          git -C "$RUNNER_TEMP/zitadel-upstream" fetch --no-write-fetch-head --depth=1 https://github.com/zitadel/zitadel.git +refs/tags/v4.20.0:refs/tags/v4.20.0
          test "$(git -C "$RUNNER_TEMP/zitadel-upstream" rev-parse 'refs/tags/v4.20.0^{commit}')" = 8afa5dd37a8e723efb9eace8d09fd5c1cccef694
      - name: Build the complete native Linux service and embedded console
        run: bash scripts/build-zitadel-linux.sh --build --capture-source --module-source-verifier "$RUNNER_TEMP/zitadel-module-sources" --bsr-source-verifier "$RUNNER_TEMP/zitadel-bsr-sources" --source "$RUNNER_TEMP/zitadel-upstream" --output "$RUNNER_TEMP/zitadel-build"
      - name: Unpack and verify the actual pre-install source archive
        run: |
          manifest="$(jq -er '.sourceSnapshot.manifestSha256' "$RUNNER_TEMP/zitadel-build/build-receipt.json")"
          archive="$(jq -er '.sourceSnapshot.archiveSha256' "$RUNNER_TEMP/zitadel-build/build-receipt.json")"
          go run scripts/zitadel-source-bundle.go --unpack "$RUNNER_TEMP/zitadel-build/prepared-source.tar" "$archive" "$manifest" "$RUNNER_TEMP/zitadel-source-roundtrip" > "$RUNNER_TEMP/zitadel-build/source-roundtrip.json"
          cmp "$RUNNER_TEMP/zitadel-build/source-snapshot/source-manifest.json" "$RUNNER_TEMP/zitadel-source-roundtrip/source-manifest.json"
      - name: Rebuild the native service from the retained prepared source
        run: |
          manifest="$(jq -er '.sourceSnapshot.manifestSha256' "$RUNNER_TEMP/zitadel-build/build-receipt.json")"
          console="$(jq -er '.consoleDownloads.manifestSha256' "$RUNNER_TEMP/zitadel-build/build-receipt.json")"
          bash scripts/build-zitadel-linux.sh --build --prepared-source "$RUNNER_TEMP/zitadel-source-roundtrip" --prepared-sha256 "$manifest" --console-inputs "$RUNNER_TEMP/zitadel-build/selected-console-originals" --console-sha256 "$console" --output "$RUNNER_TEMP/zitadel-prepared-build"
          jq -e --slurpfile original "$RUNNER_TEMP/zitadel-build/build-receipt.json" '
            .sourceInput.manifestSha256 == $original[0].sourceSnapshot.manifestSha256 and
            .sourceInput.preparedProfileSha256 == $original[0].sourceSnapshot.preparedProfileSha256 and
            .sourceInput.recipeSha256 == .recipeSha256 and .recipeSha256 == $original[0].recipeSha256 and
            .upstreamCommit == $original[0].upstreamCommit and .tools == $original[0].tools and
            .platform == "linux/amd64" and .profile == "api-login-v1-console" and
            .preparation == $original[0].preparation and
            .sourceInput.nativeOfflineReplayProved == false and
            .consoleDownloads.sourceManifestSha256 == .sourceInput.manifestSha256 and
            .consoleDownloads.manifestSha256 == $original[0].consoleDownloads.manifestSha256 and
            .consoleDownloads.requestsSha256 == $original[0].consoleDownloads.requestsSha256 and
            .consoleDownloads.helperSourceSha256 == $original[0].consoleDownloads.helperSourceSha256 and
            .consoleDownloads.launcherSha256 == $original[0].consoleDownloads.launcherSha256 and
            .consoleDownloads.installerSha256 == $original[0].consoleDownloads.installerSha256 and
            .consoleDownloads.requests == 3 and .consoleDownloads.originalConsoleDownloadsConsumed == true and
            .consoleDownloads.dependencyInputsCaptured == false and .consoleDownloads.nativeOfflineReplayProved == false and
            (has("sourceSnapshot") | not) and .imageAdmission == "unknown" and .licenseClosure == "unknown"
          ' "$RUNNER_TEMP/zitadel-prepared-build/build-receipt.json" >/dev/null
          cp "$RUNNER_TEMP/zitadel-prepared-build/build-receipt.json" "$RUNNER_TEMP/zitadel-build/prepared-build-receipt.json"
      - name: Verify the original console downloads and native consumption
        run: |
          seal="$(jq -er '.consoleDownloads.manifestSha256' "$RUNNER_TEMP/zitadel-build/build-receipt.json")"
          cp -R "$RUNNER_TEMP/zitadel-build/selected-console-originals" "$RUNNER_TEMP/zitadel-console-originals-roundtrip"
          go run scripts/zitadel-console-assets.go verify --capsule "$RUNNER_TEMP/zitadel-console-originals-roundtrip" --sha256 "$seal" > "$RUNNER_TEMP/zitadel-build/console-originals-roundtrip.json"
          go run scripts/zitadel-console-assets.go consumption --capsule "$RUNNER_TEMP/zitadel-console-originals-roundtrip" --sha256 "$seal" --requests "$RUNNER_TEMP/zitadel-build/console-download-requests" > "$RUNNER_TEMP/zitadel-build/console-consumption-roundtrip.json"
          cmp "$RUNNER_TEMP/zitadel-build/console-download-consumption.json" "$RUNNER_TEMP/zitadel-build/console-consumption-roundtrip.json"
          jq -e --slurpfile build "$RUNNER_TEMP/zitadel-build/build-receipt.json" '
            . == ($build[0].consoleDownloads | del(.sourceManifestSha256,.helperSourceSha256,.adapterSha256,.launcherSha256,.installerSha256)) and
            .schemaVersion == 1 and .requests == 3 and .originalConsoleDownloadsConsumed == true and
            .dependencyInputsCaptured == false and .nativeOfflineReplayProved == false
          ' "$RUNNER_TEMP/zitadel-build/console-consumption-roundtrip.json" >/dev/null
      - name: Verify the actual native API generator checkpoint
        run: |
          source="$(jq -er '.sourceSnapshot.manifestSha256' "$RUNNER_TEMP/zitadel-build/build-receipt.json")"
          seal="$(jq -er '.sourceSnapshot.generatorBuildMetadata.checkpointSha256' "$RUNNER_TEMP/zitadel-build/build-receipt.json")"
          cp "$RUNNER_TEMP/zitadel-build/generator-checkpoint.json" "$RUNNER_TEMP/zitadel-generator-checkpoint.json"
          "$RUNNER_TEMP/zitadel-module-sources" verify-generator-checkpoint --checkpoint "$RUNNER_TEMP/zitadel-generator-checkpoint.json" --sha256 "$seal" --source-sha256 "$source" > "$RUNNER_TEMP/zitadel-build/generator-checkpoint-roundtrip.json"
          jq -e --slurpfile build "$RUNNER_TEMP/zitadel-build/build-receipt.json" '
            . == $build[0].sourceSnapshot.generatorBuildMetadata and
            .schemaVersion == 1 and .sourceManifestSha256 == $build[0].sourceSnapshot.manifestSha256 and
            .tools == 14 and .modules > 0 and .generatorBuildMetadataValidated == true and
            .dependencyInputsCaptured == false and .nativeOfflineReplayProved == false
          ' "$RUNNER_TEMP/zitadel-build/generator-checkpoint-roundtrip.json" >/dev/null
      - name: Copy and verify the actual retained Go module inputs
        run: |
          manifest="$(jq -er '.sourceSnapshot.goModules.manifestSha256' "$RUNNER_TEMP/zitadel-build/build-receipt.json")"
          cp -R "$RUNNER_TEMP/zitadel-build/selected-go-sources" "$RUNNER_TEMP/zitadel-go-sources-roundtrip"
          "$RUNNER_TEMP/zitadel-module-sources" --verify "$RUNNER_TEMP/zitadel-go-sources-roundtrip" --sha256 "$manifest" > "$RUNNER_TEMP/zitadel-build/go-module-source-roundtrip.json"
          cmp "$RUNNER_TEMP/zitadel-build/selected-go-sources/manifest.json" "$RUNNER_TEMP/zitadel-go-sources-roundtrip/manifest.json"
      - name: Copy and authenticate the actual generator Go source inputs
        run: |
          source="$(jq -er '.sourceSnapshot.manifestSha256' "$RUNNER_TEMP/zitadel-build/build-receipt.json")"
          seal="$(jq -er '.sourceSnapshot.generatorGoSources.manifestSha256' "$RUNNER_TEMP/zitadel-build/build-receipt.json")"
          cp -R "$RUNNER_TEMP/zitadel-build/selected-generator-go-sources" "$RUNNER_TEMP/zitadel-generator-sources-roundtrip"
          "$RUNNER_TEMP/zitadel-module-sources" verify-generator-sources --package "$RUNNER_TEMP/zitadel-generator-sources-roundtrip" --sha256 "$seal" --source-sha256 "$source" > "$RUNNER_TEMP/zitadel-build/generator-source-roundtrip.json"
          jq -e --slurpfile build "$RUNNER_TEMP/zitadel-build/build-receipt.json" '
            . == $build[0].sourceSnapshot.generatorGoSources and
            .schemaVersion == 1 and .sourceManifestSha256 == $build[0].sourceSnapshot.manifestSha256 and
            .checkpointSha256 == $build[0].sourceSnapshot.generatorBuildMetadata.checkpointSha256 and
            .modules == $build[0].sourceSnapshot.generatorBuildMetadata.modules and
            .proofFiles > 0 and .files > 0 and .selectedGeneratorGoSourcesCaptured == true and
            .dependencyInputsCaptured == false and .nativeOfflineReplayProved == false
          ' "$RUNNER_TEMP/zitadel-build/generator-source-roundtrip.json" >/dev/null
      - name: Copy and authenticate the native Go graph metadata
        run: |
          source="$(jq -er '.sourceSnapshot.manifestSha256' "$RUNNER_TEMP/zitadel-build/build-receipt.json")"
          seal="$(jq -er '.sourceSnapshot.goGraphMetadata.manifestSha256' "$RUNNER_TEMP/zitadel-build/build-receipt.json")"
          cp -R "$RUNNER_TEMP/zitadel-build/go-graph-metadata" "$RUNNER_TEMP/zitadel-go-graph-metadata-roundtrip"
          "$RUNNER_TEMP/zitadel-module-sources" verify-graph-metadata --package "$RUNNER_TEMP/zitadel-go-graph-metadata-roundtrip" --sha256 "$seal" --source-sha256 "$source" > "$RUNNER_TEMP/zitadel-build/go-graph-metadata-roundtrip.json"
          jq -e --slurpfile build "$RUNNER_TEMP/zitadel-build/build-receipt.json" '
            . == $build[0].sourceSnapshot.goGraphMetadata and .schemaVersion == 1 and
            .sourceManifestSha256 == $build[0].sourceSnapshot.manifestSha256 and
            .modules > 0 and .metadataFiles >= .modules and .goGraphMetadataCaptured == true and
            .dependencyInputsCaptured == false and .nativeOfflineReplayProved == false
          ' "$RUNNER_TEMP/zitadel-build/go-graph-metadata-roundtrip.json" >/dev/null
      - name: Read back restored Go inputs without networking
        run: bash scripts/readback-zitadel-go-inputs.sh --build "$RUNNER_TEMP/zitadel-build" --module-source-verifier "$RUNNER_TEMP/zitadel-module-sources"
      - name: Replay the complete retained identity build without networking
        run: bash scripts/replay-zitadel-inputs.sh --build "$RUNNER_TEMP/zitadel-build" --module-source-verifier "$RUNNER_TEMP/zitadel-module-sources" --bsr-source-verifier "$RUNNER_TEMP/zitadel-bsr-sources" --output "$RUNNER_TEMP/zitadel-offline-replay"
      - name: Verify and restore the actual selected pnpm sources
        run: |
          seal="$(jq -er '.sourceSnapshot.pnpmSources.manifestSha256' "$RUNNER_TEMP/zitadel-build/build-receipt.json")"
          cp -R "$RUNNER_TEMP/zitadel-build/selected-pnpm-sources" "$RUNNER_TEMP/zitadel-pnpm-sources-roundtrip"
          node tools/zitadel-pnpm-source/index.mjs restore --capsule "$RUNNER_TEMP/zitadel-pnpm-sources-roundtrip" --sha256 "$seal" --scratch "$RUNNER_TEMP/zitadel-pnpm-restore-work" --store "$RUNNER_TEMP/zitadel-pnpm-restored-store" > "$RUNNER_TEMP/zitadel-build/pnpm-source-roundtrip.json"
          jq -e --slurpfile build "$RUNNER_TEMP/zitadel-build/build-receipt.json" '
            del(.nativeStoreRestored) == $build[0].sourceSnapshot.pnpmSources and
            .schemaVersion == 1 and .nativeStoreRestored == true and
            .sourceManifestSha256 == $build[0].sourceSnapshot.manifestSha256 and
            .packages > 0 and .archives > 0 and .selectedPNPMSourcesCaptured == true and
            .dependencyInputsCaptured == false and .nativeOfflineReplayProved == false
          ' "$RUNNER_TEMP/zitadel-build/pnpm-source-roundtrip.json" >/dev/null
      - name: Verify actual retained schema inputs and replay
        run: |
          manifest="$(jq -er '.sourceSnapshot.bsrSources.manifestSha256' "$RUNNER_TEMP/zitadel-build/build-receipt.json")"
          cp -R "$RUNNER_TEMP/zitadel-build/selected-bsr-sources" "$RUNNER_TEMP/zitadel-bsr-sources-roundtrip"
          "$RUNNER_TEMP/zitadel-bsr-sources" verify --package "$RUNNER_TEMP/zitadel-bsr-sources-roundtrip" --sha256 "$manifest" > "$RUNNER_TEMP/zitadel-build/bsr-source-roundtrip.json"
          cmp "$RUNNER_TEMP/zitadel-build/selected-bsr-sources/manifest.json" "$RUNNER_TEMP/zitadel-bsr-sources-roundtrip/manifest.json"
          jq -e --slurpfile build "$RUNNER_TEMP/zitadel-build/build-receipt.json" '. == $build[0].sourceSnapshot.bsrSources' "$RUNNER_TEMP/zitadel-build/bsr-source-roundtrip.json" >/dev/null
          jq -e --arg manifest "$manifest" --slurpfile build "$RUNNER_TEMP/zitadel-build/build-receipt.json" '
            . == $build[0].sourceSnapshot.bsrSchemaReplay and
            .schemaVersion == 1 and .platform == "linux/amd64" and
            .sourceManifestSha256 == $build[0].sourceSnapshot.manifestSha256 and
            .bsrManifestSha256 == $manifest and .recipeSha256 == $build[0].recipeSha256 and
            .schemaOfflineReplayProved == true and .networkDenialProved == true and .nonRootReplay == true and
            .noNewPrivilegesReplay == true and
            .dependencyInputsCaptured == false and .nativeOfflineReplayProved == false and
            (.compilers | map(.phase)) == ["api","console"] and
            .compilers[0].version == "1.67.0" and .compilers[1].version == "1.72.0" and
            all(.compilers[]; (.descriptorSha256 | test("^[0-9a-f]{64}$")) and
              .connectedMatchesOffline == true and .emptyCacheRefused == true and
              .missingMemberRefused == true and .changedMemberRefused == true)
          ' "$RUNNER_TEMP/zitadel-build/bsr-schema-replay.json" >/dev/null
      - name: Exercise the local restricted identity image
        run: go run scripts/zitadel-image-package.go scripts/zitadel-image-smoke.go --smoke --build "$RUNNER_TEMP/zitadel-build" --repository "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/zitadel-image"
      - name: Preserve build diagnostics, not unadmitted service distribution
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zitadel-linux-build-evidence
          path: |
            ${{ runner.temp }}/zitadel-build/build-receipt.json
            ${{ runner.temp }}/zitadel-build/packages.jsonl
            ${{ runner.temp }}/zitadel-build/login-icons-inventory.json
            ${{ runner.temp }}/zitadel-build/console-notices-inventory.json
            ${{ runner.temp }}/zitadel-build/console-notices-supplement-inventory.json
            ${{ runner.temp }}/zitadel-build/*.txt
            ${{ runner.temp }}/zitadel-build/*.log
            ${{ runner.temp }}/zitadel-build/*.sha256
            ${{ runner.temp }}/zitadel-build/source-snapshot/source-manifest.json
            ${{ runner.temp }}/zitadel-build/source-roundtrip.json
            ${{ runner.temp }}/zitadel-build/prepared-build-receipt.json
            ${{ runner.temp }}/zitadel-build/selected-go-sources/manifest.json
            ${{ runner.temp }}/zitadel-build/go-module-source-roundtrip.json
            ${{ runner.temp }}/zitadel-build/generator-checkpoint.json
            ${{ runner.temp }}/zitadel-build/generator-checkpoint-roundtrip.json
            ${{ runner.temp }}/zitadel-build/selected-generator-go-sources/manifest.json
            ${{ runner.temp }}/zitadel-build/generator-source-readback.json
            ${{ runner.temp }}/zitadel-build/generator-source-roundtrip.json
            ${{ runner.temp }}/zitadel-build/go-graph-metadata/manifest.json
            ${{ runner.temp }}/zitadel-build/go-graph-metadata-readback.json
            ${{ runner.temp }}/zitadel-build/go-graph-metadata-roundtrip.json
            ${{ runner.temp }}/zitadel-build/go-input-restoration.json
            ${{ runner.temp }}/zitadel-build/go-input-readback.json
            ${{ runner.temp }}/zitadel-build/go-input-native/manifest.json
            ${{ runner.temp }}/zitadel-build/selected-pnpm-sources/manifest.json
            ${{ runner.temp }}/zitadel-build/pnpm-source-roundtrip.json
            ${{ runner.temp }}/zitadel-build/pnpm-installation-check.json
            ${{ runner.temp }}/zitadel-build/selected-bsr-sources/manifest.json
