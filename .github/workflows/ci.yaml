name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      docs-deps: ${{ steps.filter.outputs.docs-deps }}
      docs-audit-contract: ${{ steps.filter.outputs.docs-audit-contract }}
      docs-npm-toolchain: ${{ steps.filter.outputs.docs-npm-toolchain }}
      active-projects: ${{ steps.filter.outputs.active-projects }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docs:
              - 'src/**'
              - 'public/**'
              - 'scripts/**'
              - '*.json'
              - '.npmrc'
              - 'astro.config.mjs'
              - 'docs/**'
              - '.github/workflows/**'
            docs-deps:
              - 'package.json'
              - 'package-lock.json'
              - 'npm-shrinkwrap.json'
              - '.npmrc'
              - 'scripts/audit-dependencies.sh'
            docs-audit-contract:
              - '.npmrc'
              - 'scripts/audit-dependencies.sh'
              - 'scripts/audit-dependencies.test.sh'
              - '.github/workflows/audit-docs.yaml'
              - '.github/workflows/ci.yaml'
            docs-npm-toolchain:
              - 'package.json'
              - 'scripts/npm-toolchain.test.sh'
              - 'scripts/dependency-overrides.test.sh'
              - '.github/workflows/**'
            active-projects:
              - 'src/content/**'
              - 'src/data/public-products.json'
              - 'src/data/cv.ts'
              - 'scripts/check-active-projects-drift.sh'
              - 'scripts/check-active-projects-drift.test.sh'
              - 'scripts/check-homepage-project-parity.mjs'
              - 'scripts/check-cv-drift.mjs'
              - 'scripts/check-cv-drift.test.sh'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yaml'

  build-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LC_ALL: C
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify lockfile with older supported npm
        working-directory: .
        run: npx --yes --package=npm@11.4.2 npm ci --ignore-scripts
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Build enabled preview
        working-directory: .
        env:
          FEATURE_PREVIEW_BANNER: "true"
        run: npm run build
      - name: Build client-facing portfolio preview
        working-directory: .
        env:
          FEATURE_CLIENT_PORTFOLIO: "true"
        run: npm run build
      - name: Build company identity preview
        working-directory: .
        env:
          FEATURE_COMPANY_IDENTITY: "true"
          COMPANY_POSTAL_ADDRESS: "Example Road 1\n1234 Exampletown"
        run: npm run build
      - name: Build revised hosting-offer preview
        working-directory: .
        env:
          FEATURE_OFFER_COPY: "true"
        run: npm run build
      - name: Build legacy revised hosting-offer preview
        working-directory: .
        env:
          FEATURE_CLIENT_PORTFOLIO: "false"
          FEATURE_FEATURED_PORTFOLIO: "false"
          FEATURE_OFFER_COPY: "true"
        run: npm run build
      - name: Build featured portfolio preview
        working-directory: .
        env:
          FEATURE_FEATURED_PORTFOLIO: "true"
        run: npm run build
      - name: Build
        working-directory: .
        env:
          FEATURE_PREVIEW_BANNER: "false"
          FEATURE_CLIENT_PORTFOLIO: "false"
          FEATURE_COMPANY_IDENTITY: "false"
          FEATURE_OFFER_COPY: "false"
          FEATURE_FEATURED_PORTFOLIO: "false"
        run: npm run build
      - name: Build entirely unset production
        working-directory: .
        run: env -u FEATURE_CLIENT_PORTFOLIO -u FEATURE_PREVIEW_BANNER -u FEATURE_OFFER_COPY -u FEATURE_FEATURED_PORTFOLIO -u FEATURE_COMPANY_IDENTITY npm run build
      - name: Verify the published Journal presentation
        working-directory: .
        run: node scripts/check-journal-presentation.mjs dist
      - name: Verify offering-copy accessibility controls
        run: node scripts/check-offering-copy.test.mjs dist
      - name: Verify public portal boundary controls
        run: bash scripts/check-portal-artifacts.test.sh
      - name: Verify the actual public artifact excludes portal identity
        run: bash scripts/check-portal-artifacts.sh dist
      - name: Upload reviewable production preview
        # Only static public output is eligible; server code and identity fixtures
        # must not enter the preview or Pages artifact.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: business-site-preview
          path: dist
          if-no-files-found: error
          retention-days: 7

  audit-docs:
    needs: changes
    if: needs.changes.outputs.docs-deps == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Test audit wrapper
        working-directory: .
        run: ./scripts/audit-dependencies.test.sh
      - name: Audit
        working-directory: .
        run: ./scripts/audit-dependencies.sh

  test-docs-audit-wrapper:
    needs: changes
    if: needs.changes.outputs.docs-audit-contract == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Test audit wrapper
        working-directory: .
        run: ./scripts/audit-dependencies.test.sh

  test-docs-npm-toolchain:
    needs: changes
    if: needs.changes.outputs.docs-npm-toolchain == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test npm toolchain contract
        run: bash scripts/npm-toolchain.test.sh
      - name: Test dependency override contract
        run: bash scripts/dependency-overrides.test.sh

  drift-check-active-projects:
    needs: changes
    if: needs.changes.outputs.active-projects == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install MDX parser dependencies
        working-directory: .
        run: npm ci
      # The monorepo validates the real pinned sibling products. This source
      # repository retains all hermetic negative controls, not a fake live census.
      - name: Self-test the drift checker
        run: bash scripts/check-active-projects-drift.test.sh
      - name: Self-test the CV drift checker
        run: bash scripts/check-cv-drift.test.sh
      - name: Check the About page and CV data for drift
        run: node scripts/check-cv-drift.mjs src/content/docs/about.mdx src/data/cv.ts

  test-repository-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source-owned publishing and editorial contracts
        run: |
          bash scripts/publishing-contract.test.sh
          bash scripts/site-publication.test.sh
          bash scripts/editorial-contract.test.sh

  test-portal-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    env:
      LC_ALL: C
      GOTOOLCHAIN: local
      PORTAL_TEST_DATABASE_URL: postgres://portal_runtime:fixture-only@localhost:5432/portal_identity_test?sslmode=disable
      PORTAL_TEST_MIGRATION_DATABASE_URL: postgres://portal_migrator:fixture-only@localhost:5432/portal_identity_test?sslmode=disable
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: portal_fixture_owner
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_fixture_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Setup Node.js for combined package
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        working-directory: .
        run: npm ci
      - name: Test actual served request-character controls
        working-directory: .
        run: node --test scripts/portal-request-limits.test.mjs
      - name: Verify actual Go-template HTML quality and retained attribute failures
        working-directory: .
        run: npx --yes --package=htmlhint@1.9.2 -- node --test scripts/portal-template-quality.test.mjs
      - name: Verify compatible embedded Go analysis and genuine finding rejection
        working-directory: .
        run: node --test scripts/portal-go-analyzer-quality.test.mjs
      - name: Verify portal copy and API vocabulary with retained typo failures
        working-directory: .
        run: npx --yes --package=cspell@10.1.1 -- node --test scripts/portal-spelling-quality.test.mjs
      - name: Verify package documentation with all selected Go files
        working-directory: .
        env:
          GOBIN: ${{ runner.temp }}/portal-quality-tools
        run: |
          go install github.com/mgechev/revive@v1.16.0
          PORTAL_REVIVE="$GOBIN/revive" bash scripts/portal-package-quality.test.sh
      - name: Provision isolated test database roles
        env:
          PGPASSWORD: fixture-only
        run: psql -h localhost -U portal_fixture_owner -d postgres -v ON_ERROR_STOP=1 -f testdata/provision.sql
      - name: Verify dependencies and formatting
        run: |
          go mod verify
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Test broker and durable access boundary
        run: go test -race -coverprofile=coverage.out ./... -count=1 -timeout=90s
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Verify combined-runtime CI contract
        working-directory: .
        run: |
          node --test scripts/runtime-contract.test.mjs
          node --test scripts/container-contract.test.mjs
      - name: Build actual combined package
        working-directory: .
        run: bash scripts/package-runtime.sh --release
      - name: Exercise actual combined package
        working-directory: .
        run: node scripts/runtime-smoke.test.mjs runtime-dist
      - name: Exercise extracted runtime archive
        working-directory: .
        run: |
          extracted="$(mktemp -d)"
          tar -xzf runtime-dist/business-site-runtime.tar.gz -C "$extracted"
          node scripts/runtime-smoke.test.mjs "$extracted"
      - name: Build actual restricted container
        working-directory: .
        run: |
          package="$(find runtime-dist -maxdepth 1 -type d -name 'package.*')"
          test -n "$package" && test "$(printf '%s\n' "$package" | wc -l)" -eq 1
          docker build --file Dockerfile --label "org.opencontainers.image.source=https://github.com/devantler-tech/business-site" --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" --tag business-site:test "$package"
      - name: Exercise actual restricted container
        working-directory: .
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/container-smoke.test.mjs business-site:test runtime-dist
      - name: Archive the tested container and its exact runtime package
        working-directory: .
        run: |
          mkdir -p runtime-dist/container
          docker save business-site:test | gzip > runtime-dist/container/image.tar.gz
          cp runtime-dist/business-site-runtime.tar.gz runtime-dist/container/
      - name: Upload tested container
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: business-site-container
          path: runtime-dist/container
          if-no-files-found: error
          retention-days: 7
      - name: Upload reviewed runtime package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: business-site-runtime
          path: runtime-dist/business-site-runtime.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Publication waits for complete validation; final required checks also
  # cover signing, provenance verification and the published-image smoke test.
  validation:
    name: CI - Prepublication Checks
    runs-on: ubuntu-latest
    if: always()
    permissions: {}
    needs:
      - changes
      - build-docs
      - audit-docs
      - test-docs-audit-wrapper
      - test-docs-npm-toolchain
      - drift-check-active-projects
      - test-repository-contracts
      - test-portal-identity
    steps:
      - name: Check job results
        uses: devantler-tech/.github/actions/aggregate-job-checks@c1aaea1b8470627e75a3c3f7caee74e0a93ca4de
        with:
          job-results: >-
            ${{ needs.changes.result }}
            ${{ needs.build-docs.result }}
            ${{ needs.audit-docs.result }}
            ${{ needs.test-docs-audit-wrapper.result }}
            ${{ needs.test-docs-npm-toolchain.result }}
            ${{ needs.drift-check-active-projects.result }}
            ${{ needs.test-repository-contracts.result }}
            ${{ needs.test-portal-identity.result }}

  status:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    if: always()
    permissions: {}
    needs:
      - changes
      - build-docs
      - audit-docs
      - test-docs-audit-wrapper
      - test-docs-npm-toolchain
      - drift-check-active-projects
      - test-repository-contracts
      - test-portal-identity
      - validation
      - publish-container
    steps:
      - name: Check job results
        uses: devantler-tech/.github/actions/aggregate-job-checks@c1aaea1b8470627e75a3c3f7caee74e0a93ca4de
        with:
          job-results: >-
            ${{ needs.changes.result }}
            ${{ needs.build-docs.result }}
            ${{ needs.audit-docs.result }}
            ${{ needs.test-docs-audit-wrapper.result }}
            ${{ needs.test-docs-npm-toolchain.result }}
            ${{ needs.drift-check-active-projects.result }}
            ${{ needs.test-repository-contracts.result }}
            ${{ needs.test-portal-identity.result }}
            ${{ needs.validation.result }}
            ${{ needs.publish-container.result }}
      - name: Require actual main-push container publication
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'devantler-tech/business-site'
        env:
          PUBLICATION_RESULT: ${{ needs.publish-container.result }}
        run: test "$PUBLICATION_RESULT" = success

  # The same run distributes its tested bytes only after the complete CI gate.
  # No privileged workflow_run crosses from an untrusted PR to registry writes.
  publish-container:
    needs: [validation, test-portal-identity]
    if: >-
      !cancelled() &&
      needs.validation.result == 'success' &&
      needs.test-portal-identity.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'devantler-tech/business-site'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    env:
      LC_ALL: C
      SOURCE_SHA: ${{ github.sha }}
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout the successful immutable main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Download only this successful CI run's tested image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: business-site-container
          path: runtime-dist/container
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Load and re-exercise the exact tested image before registry writes
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          tar -xzf runtime-dist/container/business-site-runtime.tar.gz -C runtime-dist
          docker load --input runtime-dist/container/image.tar.gz
          node scripts/container-smoke.test.mjs business-site:test runtime-dist
      - name: Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push only the tested image to a run-scoped staging tag
        id: image
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          image=ghcr.io/devantler-tech/business-site
          tag="$image:staging-$RUN_ID-$RUN_ATTEMPT"
          docker tag business-site:test "$tag"
          docker push "$tag"
          ref="$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')"
          [[ "$ref" =~ ^ghcr.io/devantler-tech/business-site@sha256:[0-9a-f]{64}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Sign and verify source-bound digest and build provenance
        env:
          PUBLISHED_IMAGE: ${{ steps.image.outputs.ref }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ && "$CI_RUN_ATTEMPT" =~ ^[0-9]+$ && "$RUN_ID" =~ ^[0-9]+$ && "$RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$WORKFLOW_IDENTITY" == https://github.com/devantler-tech/business-site/.github/workflows/ci.yaml@refs/heads/main ]]
          mkdir -p runtime-dist/container-publication
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges "$PUBLISHED_IMAGE" --version > runtime-dist/container-publication/runtime.json
          public_digest="$(jq -er --arg sha "$SOURCE_SHA" 'select(.Repository == "devantler-tech/business-site" and .SourceRevision == $sha and .Mode == "release") | .PublicDigest' runtime-dist/container-publication/runtime.json)"
          [[ "$public_digest" =~ ^[0-9a-f]{64}$ ]]
          digest="${PUBLISHED_IMAGE##*@}"
          annotations=(
            -a devantler.repository=devantler-tech/business-site
            -a "devantler.source-sha=$SOURCE_SHA"
            -a "devantler.public-digest=$public_digest"
            -a "devantler.ci-run-id=$CI_RUN_ID"
            -a "devantler.ci-run-attempt=$CI_RUN_ATTEMPT"
            -a "devantler.run-id=$RUN_ID"
            -a "devantler.run-attempt=$RUN_ATTEMPT"
            -a "devantler.workflow-sha=$WORKFLOW_SHA"
          )
          cosign sign --yes "${annotations[@]}" "$PUBLISHED_IMAGE"
          cosign verify --certificate-identity "$WORKFLOW_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "${annotations[@]}" "$PUBLISHED_IMAGE" > runtime-dist/container-publication/signature.json
          jq -n --arg identity "$WORKFLOW_IDENTITY" --arg sha "$SOURCE_SHA" --arg ci "$CI_RUN_ID" --arg attempt "$CI_RUN_ATTEMPT" --arg run "$RUN_ID" --arg digest "$public_digest" '{builder:{id:$identity},buildType:"https://devantler.tech/build-types/combined-runtime-container/v1",invocation:{configSource:{uri:"git+https://github.com/devantler-tech/business-site",digest:{sha1:$sha},entryPoint:".github/workflows/ci.yaml"},parameters:{ciRunId:$ci,ciRunAttempt:$attempt,publicDigest:$digest}},metadata:{buildInvocationId:("https://github.com/devantler-tech/business-site/actions/runs/"+$run),completeness:{parameters:true,environment:false,materials:false},reproducible:false},materials:[{uri:"git+https://github.com/devantler-tech/business-site",digest:{sha1:$sha}}]}' > runtime-dist/container-publication/provenance.json
          cosign attest --yes --type slsaprovenance --predicate runtime-dist/container-publication/provenance.json "$PUBLISHED_IMAGE"
          cosign verify-attestation --type slsaprovenance --certificate-identity "$WORKFLOW_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$PUBLISHED_IMAGE" > runtime-dist/container-publication/attestation.json
          # Check the signed statement's actual subject and source, not only that
          # some statement exists under this publisher's identity.
          jq -es --arg sha "$SOURCE_SHA" --arg digest "${digest#sha256:}" '[.[] | .payload | @base64d | fromjson | select(.predicateType == "https://slsa.dev/provenance/v0.2" and .predicate.invocation.configSource.digest.sha1 == $sha and any(.subject[]; .digest.sha256 == $digest))] | length > 0' runtime-dist/container-publication/attestation.json
          jq -n --arg ref "$PUBLISHED_IMAGE" --arg source "$SOURCE_SHA" --arg public "$public_digest" --arg identity "$WORKFLOW_IDENTITY" --arg workflow "$WORKFLOW_SHA" --arg ci "$CI_RUN_ID" --arg attempt "$CI_RUN_ATTEMPT" --arg run "$RUN_ID" --arg runAttempt "$RUN_ATTEMPT" '{repository:"devantler-tech/business-site",sourceRevision:$source,publicDigest:$public,image:$ref,signerIdentity:$identity,workflowRevision:$workflow,ciRunId:$ci,ciRunAttempt:$attempt,publicationRunId:$run,publicationRunAttempt:$runAttempt}' > runtime-dist/container-publication/receipt.json
      - name: Pull and exercise the signed published digest, not its tag
        env:
          PUBLISHED_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker pull "$PUBLISHED_IMAGE"
          node scripts/container-smoke.test.mjs "$PUBLISHED_IMAGE" runtime-dist
      - name: Upload source/digest/signature/provenance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: business-site-container-publication
          path: runtime-dist/container-publication
          if-no-files-found: error
          retention-days: 90
