name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      docs-deps: ${{ steps.filter.outputs.docs-deps }}
      docs-audit-contract: ${{ steps.filter.outputs.docs-audit-contract }}
      docs-npm-toolchain: ${{ steps.filter.outputs.docs-npm-toolchain }}
      active-projects: ${{ steps.filter.outputs.active-projects }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docs:
              - 'src/**'
              - 'public/**'
              - 'scripts/**'
              - '*.json'
              - '.npmrc'
              - 'astro.config.mjs'
              - 'docs/**'
              - '.github/workflows/**'
            docs-deps:
              - 'package.json'
              - 'package-lock.json'
              - 'npm-shrinkwrap.json'
              - '.npmrc'
              - 'scripts/audit-dependencies.sh'
            docs-audit-contract:
              - '.npmrc'
              - 'scripts/audit-dependencies.sh'
              - 'scripts/audit-dependencies.test.sh'
              - '.github/workflows/audit-docs.yaml'
              - '.github/workflows/ci.yaml'
            docs-npm-toolchain:
              - 'package.json'
              - 'scripts/npm-toolchain.test.sh'
              - 'scripts/dependency-overrides.test.sh'
              - '.github/workflows/**'
            active-projects:
              - 'src/content/**'
              - 'src/data/public-products.json'
              - 'src/data/cv.ts'
              - 'scripts/check-active-projects-drift.sh'
              - 'scripts/check-active-projects-drift.test.sh'
              - 'scripts/check-homepage-project-parity.mjs'
              - 'scripts/check-cv-drift.mjs'
              - 'scripts/check-cv-drift.test.sh'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yaml'

  build-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LC_ALL: C
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify lockfile with older supported npm
        working-directory: .
        run: npx --yes --package=npm@11.4.2 npm ci --ignore-scripts
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Build enabled preview
        working-directory: .
        env:
          FEATURE_PREVIEW_BANNER: "true"
        run: npm run build
      - name: Build client-facing portfolio preview
        working-directory: .
        env:
          FEATURE_CLIENT_PORTFOLIO: "true"
        run: npm run build
      - name: Build Journal presentation preview
        working-directory: .
        env:
          FEATURE_JOURNAL_PRESENTATION: "true"
        run: npm run build
      - name: Build company identity preview
        working-directory: .
        env:
          FEATURE_COMPANY_IDENTITY: "true"
          COMPANY_POSTAL_ADDRESS: "Example Road 1\n1234 Exampletown"
        run: npm run build
      - name: Build revised hosting-offer preview
        working-directory: .
        env:
          FEATURE_OFFER_COPY: "true"
        run: npm run build
      - name: Build featured portfolio preview
        working-directory: .
        env:
          FEATURE_FEATURED_PORTFOLIO: "true"
        run: npm run build
      - name: Build
        working-directory: .
        env:
          FEATURE_PREVIEW_BANNER: "false"
          FEATURE_CLIENT_PORTFOLIO: "false"
          FEATURE_JOURNAL_PRESENTATION: "false"
          FEATURE_COMPANY_IDENTITY: "false"
          FEATURE_OFFER_COPY: "false"
          FEATURE_FEATURED_PORTFOLIO: "false"
        run: npm run build
      - name: Build entirely unset production
        working-directory: .
        run: env -u FEATURE_CLIENT_PORTFOLIO -u FEATURE_PREVIEW_BANNER -u FEATURE_JOURNAL_PRESENTATION -u FEATURE_OFFER_COPY -u FEATURE_FEATURED_PORTFOLIO -u FEATURE_COMPANY_IDENTITY npm run build
      - name: Verify public portal boundary controls
        run: bash scripts/check-portal-artifacts.test.sh
      - name: Verify the actual public artifact excludes portal identity
        run: bash scripts/check-portal-artifacts.sh dist
      - name: Upload reviewable production preview
        # Only static public output is eligible; server code and identity fixtures
        # must not enter the preview or Pages artifact.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: business-site-preview
          path: dist
          if-no-files-found: error
          retention-days: 7

  audit-docs:
    needs: changes
    if: needs.changes.outputs.docs-deps == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Test audit wrapper
        working-directory: .
        run: ./scripts/audit-dependencies.test.sh
      - name: Audit
        working-directory: .
        run: ./scripts/audit-dependencies.sh

  test-docs-audit-wrapper:
    needs: changes
    if: needs.changes.outputs.docs-audit-contract == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Test audit wrapper
        working-directory: .
        run: ./scripts/audit-dependencies.test.sh

  test-docs-npm-toolchain:
    needs: changes
    if: needs.changes.outputs.docs-npm-toolchain == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test npm toolchain contract
        run: bash scripts/npm-toolchain.test.sh
      - name: Test dependency override contract
        run: bash scripts/dependency-overrides.test.sh

  drift-check-active-projects:
    needs: changes
    if: needs.changes.outputs.active-projects == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install MDX parser dependencies
        working-directory: .
        run: npm ci
      # The monorepo validates the real pinned sibling products. This source
      # repository retains all hermetic negative controls, not a fake live census.
      - name: Self-test the drift checker
        run: bash scripts/check-active-projects-drift.test.sh
      - name: Self-test the CV drift checker
        run: bash scripts/check-cv-drift.test.sh
      - name: Check the About page and CV data for drift
        run: node scripts/check-cv-drift.mjs src/content/docs/about.mdx src/data/cv.ts

  test-repository-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source-owned publishing and editorial contracts
        run: |
          bash scripts/publishing-contract.test.sh
          bash scripts/site-publication.test.sh
          bash scripts/editorial-contract.test.sh

  test-portal-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    env:
      LC_ALL: C
      GOTOOLCHAIN: local
      PORTAL_TEST_DATABASE_URL: postgres://portal_runtime:fixture-only@localhost:5432/portal_identity_test?sslmode=disable
      PORTAL_TEST_MIGRATION_DATABASE_URL: postgres://portal_migrator:fixture-only@localhost:5432/portal_identity_test?sslmode=disable
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: portal_fixture_owner
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_fixture_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Provision isolated test database roles
        env:
          PGPASSWORD: fixture-only
        run: psql -h localhost -U portal_fixture_owner -d postgres -v ON_ERROR_STOP=1 -f testdata/provision.sql
      - name: Verify dependencies and formatting
        run: |
          go mod verify
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Test broker and durable access boundary
        run: go test -race -coverprofile=coverage.out ./... -count=1 -timeout=90s
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  status:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    if: always()
    permissions: {}
    needs:
      - changes
      - build-docs
      - audit-docs
      - test-docs-audit-wrapper
      - test-docs-npm-toolchain
      - drift-check-active-projects
      - test-repository-contracts
      - test-portal-identity
    steps:
      - name: Check job results
        uses: devantler-tech/.github/actions/aggregate-job-checks@c1aaea1b8470627e75a3c3f7caee74e0a93ca4de
        with:
          job-results: >-
            ${{ needs.changes.result }}
            ${{ needs.build-docs.result }}
            ${{ needs.audit-docs.result }}
            ${{ needs.test-docs-audit-wrapper.result }}
            ${{ needs.test-docs-npm-toolchain.result }}
            ${{ needs.drift-check-active-projects.result }}
            ${{ needs.test-repository-contracts.result }}
            ${{ needs.test-portal-identity.result }}
