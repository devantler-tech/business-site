name: Release - Public Runtime

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Nonpublishing credential preflight, or an explicitly enabled release
        type: choice
        options: [dry-run, release]
        default: dry-run

permissions: {}

jobs:
  admit:
    if: ${{ github.repository == 'devantler-tech/business-site' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.mode == 'dry-run' || (inputs.mode == 'release' && vars.RUNTIME_PUBLICATION_ENABLED == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      image-digest: ${{ steps.admit.outputs.image-digest }}
      public-digest: ${{ steps.admit.outputs.public-digest }}
      ci-run-id: ${{ steps.admit.outputs.ci-run-id }}
      ci-run-attempt: ${{ steps.admit.outputs.ci-run-attempt }}
    steps:
      - name: Checkout the frozen caller source, not an event-supplied ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup the exact receipt-reader toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Compile the source-owned archive reader
        env:
          GOTOOLCHAIN: local
        run: go -C server build -o "$RUNNER_TEMP/runtime-receipt" ./cmd/runtime-receipt
      - name: Admit the current original main CI archive without extraction
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_PUBLICATION_ENABLED: ${{ vars.RUNTIME_PUBLICATION_ENABLED }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: bash scripts/admit-runtime-release.sh
      - name: Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Authenticate only for registry reads
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Reserve the immutable helper directory
        run: test ! -e .runtime-publisher && test ! -L .runtime-publisher
      - name: Checkout only the accepted immutable original-image verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devantler-tech/.github
          ref: 467f07582436a26b62cf4aa756423512f85ba0c0
          path: .runtime-publisher
          persist-credentials: false
      - name: Verify the original image signature and complete provenance
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.admit.outputs.image-digest }}
          PUBLIC_DIGEST: ${{ steps.admit.outputs.public-digest }}
          ORIGINAL_CI_RUN_ID: ${{ steps.admit.outputs.ci-run-id }}
          ORIGINAL_CI_RUN_ATTEMPT: ${{ steps.admit.outputs.ci-run-attempt }}
        run: bash scripts/verify-runtime-origin.sh

  release:
    needs: admit
    permissions:
      contents: read
    uses: devantler-tech/.github/.github/workflows/create-release.yaml@8e2dfbd3f9249b76b58234189ccbbae98d11b32b
    with:
      disable-issue-side-effects: true
      warn-missing-breaking-bang: true
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
