---
name: 🗂️ Stale Issue Triage

on:
  pull_request:
    paths: [.github/workflows/stale-issues.yaml]
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview without changing issues or saved progress.
        type: boolean
        default: true

permissions: {}

concurrency:
  group: stale-issues-caller
  cancel-in-progress: false

jobs:
  triage:
    # Keep portfolio automation disabled in external template copies.
    if: ${{ github.repository_owner == 'devantler-tech' }}
    uses: devantler-tech/.github/.github/workflows/triage-stale-issues.yaml@6d7f2729066619564913566e573dfee6eadb3208 # v21.3.3
    permissions:
      issues: write
      actions: write
    with:
      dry-run: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' && inputs.dry-run }}
